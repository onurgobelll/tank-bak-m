<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F0FDF4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tank Takip</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8FAFC;--surface:#FFFFFF;--surface2:#F1F5F9;--line:#E2E8F0;
  --ink:#0F172A;--muted:#64748B;
  --mavi:#15803D;--mavi2:#16A34A;--yesil:#15803D;--yesil2:#22C55E;
  --amber:#D97706;--brine:#15803D;--alarm:#DC2626;
  --cond:"Barlow Condensed",'Arial Narrow',system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --golge:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.07);
  --golge-mavi:0 6px 18px rgba(21,128,61,.28);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:#F8FAFC;
  color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding:env(safe-area-inset-top) 0 110px;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}

header{position:sticky;top:0;z-index:20;background:rgba(240,253,244,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(21,128,61,.14);padding:14px 16px 10px}
.top{display:flex;align-items:center;gap:10px}
.top h1{font-family:var(--cond);font-weight:700;font-size:26px;letter-spacing:.09em;text-transform:uppercase;margin:0;flex:1;color:#14532D}
.icon{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px 13px;color:#15803D;
  font-family:var(--body);font-size:12.5px;font-weight:600;letter-spacing:.01em;transition:transform .12s ease}
.icon:active{transform:scale(.96);background:var(--surface2)}
#ara{margin-top:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
.chips{display:flex;gap:7px;margin-top:9px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:8px 15px 7px;font-family:var(--cond);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip b{color:var(--ink);font-weight:600;margin-left:5px}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--mavi),var(--mavi2));color:#fff;border-color:transparent;box-shadow:var(--golge-mavi)}
.chip[aria-pressed="true"] b{color:#fff}

main{padding:8px 16px 0}
.card{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:14px 15px 14px 18px;margin-bottom:12px;width:100%;text-align:left;box-shadow:var(--golge);
  position:relative;overflow:hidden;transition:transform .12s ease,box-shadow .12s ease}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--yesil)}
.card.ph-uyari::before{background:var(--amber)}
.card.st-hazir{background:linear-gradient(135deg,#FFFFFF 40%,#EAF9F0);border-color:rgba(21,163,74,.45)}
.card.st-hazir::before{background:var(--yesil)}
.card.st-yakin{background:linear-gradient(135deg,#FFFFFF 40%,#FDF6E7);border-color:rgba(194,116,10,.4)}
.card.st-yakin::before{background:var(--amber)}
.card.st-gecti{background:linear-gradient(135deg,#FFFFFF 30%,#FDECEF);border-color:rgba(220,38,71,.5)}
.card.st-gecti::before{background:var(--alarm)}
.card.st-bosaltildi{opacity:.65}
.card.st-bosaltildi::before{background:var(--muted)}
.card:active{background:var(--surface2);transform:scale(.98);box-shadow:0 1px 4px rgba(15,23,42,.08)}
.gauge{position:relative;flex:0 0 40px;height:78px;border-radius:5px 5px 8px 8px;border:2px solid var(--line);
  background:#EDF2F8;overflow:hidden}
.gauge .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(var(--yesil2),var(--yesil));opacity:.95}
.gauge .cap{position:absolute;top:0;left:0;right:0;height:6px;background:var(--surface2)}
.gauge .gday{position:absolute;inset:auto 0 0 0;text-align:center;font-family:var(--cond);font-size:19px;
  font-weight:700;line-height:1;padding:5px 0 6px;color:#06250F}
.g-warn .fill{background:var(--amber)}.g-late .fill{background:var(--alarm)}
.info{flex:1;min-width:0}
.row1{display:flex;align-items:baseline;gap:7px}
.kod{font-family:var(--cond);font-size:27px;font-weight:700;letter-spacing:.03em;line-height:1;color:var(--ink)}
.kap{font-family:var(--cond);font-size:14px;color:var(--muted);letter-spacing:.08em}
.urun{margin:2px 0 7px;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.01em;
  border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);background:var(--surface2)}
.pill.on-time{color:#15803D;border-color:rgba(21,128,61,.25);background:#DCFCE7}
.pill.soon{color:#B45309;border-color:rgba(217,119,6,.25);background:#FEF3C7}
.pill.ready{background:#15803D;color:#fff;border-color:transparent;font-weight:700}
.pill.bugunPill{background:#D97706;color:#fff;border-color:transparent;font-weight:700}
.gorev.gecikmis{background:#FFF7ED;border-color:#FDBA74}
.gorev.gecikmis .gk{color:#9A3412}
.gecRozet{color:#DC2626;font-weight:700}
.gecSay{color:#DC2626;margin-left:3px;font-size:.85em}
.notKart{background:#FFFBEB;border:1px solid #FDE68A;border-radius:12px;padding:11px 13px;margin-bottom:8px}
.ndFotoOnizle{position:relative;display:inline-block;margin-top:4px}
.ndFotoOnizle img{max-width:100%;max-height:180px;border-radius:10px;display:block;object-fit:cover}
.ndFotoOnizle button{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;border:none;font-size:14px;line-height:1}
.notFotoRozet{margin-top:7px;border:1px solid #FDE68A;background:#fff;color:#92400E;
  border-radius:8px;padding:5px 11px;font-size:11.5px;font-weight:600}
.notFotoRozet:active{transform:scale(.96)}
.fotoOverlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:999;
  display:flex;align-items:center;justify-content:center;padding:20px}
.fotoOverlay img{max-width:100%;max-height:100%;border-radius:10px}
.fotoYukleniyor{color:#fff;font-size:14px}
.notMetin{font-size:14px;color:var(--ink);line-height:1.45;white-space:pre-wrap;word-break:break-word}
.notAlt{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap}
.notAlt>span:first-child{font-size:11px;color:#92400E}
.notBtn{display:flex;gap:6px}
.notD,.notS{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:11.5px;font-weight:600}
.notD{color:#15803D}
.notS{color:var(--alarm)}
.notD:active,.notS:active{transform:scale(.95)}
.pill.notPill{background:#FEF3C7;color:#92400E;border-color:#FDE68A;font-weight:700}
.pill.acikPill{background:#7C3AED;color:#fff;border-color:transparent;font-weight:700}
.tersUyari{background:#FFF7ED;border:1.5px solid #FDBA74;border-radius:12px;padding:11px 13px;margin:8px 0;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tersUyari b{display:block;font-size:13.5px;color:#9A3412}
.tersUyari span{display:block;font-size:11.5px;color:#B45309;margin-top:3px;line-height:1.4}
.tersUyari .btn{width:auto;margin:0;padding:8px 14px;font-size:12.5px;flex-shrink:0}
.anKart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:6px}
.anBas{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.anBas b{font-family:var(--cond);font-size:16px;letter-spacing:.03em}
.anBas span{font-size:11px;color:var(--muted)}
.anDegerler{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.anDeger{background:var(--bg);border-radius:7px;padding:5px 6px;text-align:center}
.anDeger span{display:block;font-size:10px;color:var(--muted);margin-bottom:1px}
.anDeger b{font-size:14px;font-weight:600}
.anDeger.anSapan{background:#FEF2F2}
.anDeger.anSapan span,.anDeger.anSapan b{color:var(--alarm)}
.anAlt{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.anUyari{font-size:10.5px;color:var(--alarm);font-weight:600;white-space:nowrap}
.anTekrarBtn{margin:0;padding:6px 12px;font-size:12px;width:auto;flex-shrink:0}
.pill.numBekPill{background:#EDE9FE;color:#5B21B6;border-color:#DDD6FE;font-weight:700}
.pill.numAlPill{background:#F5F3FF;color:#6D28D9;border-color:#DDD6FE}
.tuzToplamKart{background:#F0FDF4;border:1px solid #86EFAC;border-radius:12px;padding:11px 14px;margin-bottom:12px}
.tuzToplamKart>span:first-child{font-size:12.5px;color:#166534;font-weight:600;display:block;margin-bottom:6px}
.tuzSatir{display:flex;align-items:center;justify-content:space-between;padding:4px 0;font-size:12.5px;color:#166534;
  border-top:1px dashed #BBF7D0}
.tuzSatir:first-of-type{border-top:none}
.tuzSatir b{font-family:var(--cond);font-size:14px;color:#15803D;font-weight:600}
.tuzSatir.tuzSatirToplam{border-top:1.5px solid #86EFAC;margin-top:4px;padding-top:8px}
.tuzSatir.tuzSatirToplam span{font-weight:700;color:#166534}
.tuzSatir.tuzSatirToplam b{font-size:18px}
.numKart{background:#F5F3FF;border:1px solid #C4B5FD;border-radius:12px;padding:10px 12px;margin-bottom:9px}
.gArsivRozet{background:#EDE9FE;color:#5B21B6;border-radius:7px;padding:3px 8px;font-size:11px;font-weight:600}
.gArsivSatir{margin-top:5px;padding-top:5px;border-top:1px dashed #DDD6FE;font-size:12px;color:#6D28D9;line-height:1.45}
.numKart b{font-family:var(--cond);font-size:18px;letter-spacing:.04em;color:#5B21B6}
.numKart span{display:block;font-size:11.5px;color:#6D28D9;margin-top:2px}
.chip.chipNum{border-color:#DDD6FE;color:#5B21B6}
.chip.chipNum b{color:#7C3AED}
.chip.chipNum[aria-pressed="true"]{background:#7C3AED;color:#fff;border-color:transparent}
.chip.chipNum[aria-pressed="true"] b{color:#fff}
.notTankKart{background:#FFFBEB;border:1px solid #FDE68A;border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.notTankKart:active{transform:scale(.99)}
.ntBas{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ntBas b{font-family:var(--cond);font-size:18px;letter-spacing:.04em;color:#92400E}
.ntBas span{font-size:11.5px;color:#B45309;flex:1}
.ntBas em{font-size:11.5px;color:#92400E;font-style:normal;font-weight:700}
.ntNot{font-size:13px;color:var(--ink);line-height:1.4;margin-top:6px;padding-left:9px;border-left:2px solid #FDE68A}
.ntNot span{display:block;font-size:10.5px;color:#B45309;margin-top:2px}
.acikKart{background:#F5F3FF;border:1px solid #C4B5FD;border-radius:12px;padding:10px 12px;margin-bottom:7px}
.acikKart b{font-family:var(--cond);font-size:18px;letter-spacing:.04em;color:#5B21B6}
.acikKart span{display:block;font-size:11.5px;color:#6D28D9;margin-top:2px}
.gecUyari{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:#FEF2F2;border:1.5px solid #FCA5A5;border-radius:14px;padding:12px 14px;margin-bottom:11px;
  box-shadow:0 2px 10px rgba(220,38,38,.09);transition:transform .12s}
.gecUyari:active{transform:scale(.985)}
.gecIkon{font-size:21px;line-height:1}
.gecMetin{font-size:12px;color:#B91C1C}
.gecMetin b{display:block;font-family:var(--cond);font-size:18px;letter-spacing:.03em;color:#991B1B;text-transform:uppercase}
.gecOk{margin-left:auto;font-size:24px;color:#DC2626;line-height:1}
.chip.chipGec{border-color:#FCA5A5;color:#B91C1C}
.chip.chipGec b{color:#DC2626}
.chip.chipGec[aria-pressed="true"]{background:#DC2626;color:#fff;border-color:transparent}
.chip.chipGec[aria-pressed="true"] b{color:#fff}
.pill.kapaliPill{background:#E0E7FF;color:#3730A3;border-color:#C7D2FE;font-weight:700}
.pill.late{background:#DC2626;color:#fff;border-color:transparent;font-weight:700}
.empty{border:1px dashed var(--line);border-radius:14px;padding:26px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--cond);font-size:19px;letter-spacing:.06em;color:var(--ink);text-transform:uppercase;margin-bottom:5px}

.iebar{display:flex;gap:9px;align-items:center;margin-top:10px}
.iebar input[type=date]{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
.ozetAc{width:100%;margin:10px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:11px 14px;font-family:var(--cond);font-size:16px;letter-spacing:.05em;color:var(--mavi);
  font-weight:700;text-align:left;box-shadow:var(--golge)}
.ozetAc span{float:right;color:var(--muted)}
.ozetPanel{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:8px;
  padding:4px 14px 8px;box-shadow:var(--golge)}
.ozetSatir{display:flex;align-items:baseline;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.ozetSatir:last-child{border-bottom:none}
.ozetSatir .ou{flex:1;font-size:14px;color:var(--ink)}
.ozetSatir .oa{font-family:var(--cond);font-size:15px;color:var(--muted);letter-spacing:.04em}
.ozetSatir .ok{font-family:var(--cond);font-size:17px;font-weight:700;color:var(--yesil);min-width:74px;text-align:right}
.ozetTop{border-top:2px solid var(--line);margin-top:2px}
.ozetTop .ou,.ozetTop .oa{font-weight:700;color:var(--ink)}
.ozetTop .ok{color:var(--mavi)}
.ozet{display:flex;gap:9px;margin-bottom:12px}
.ozet div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--golge)}
.ozet span{display:block;font-family:var(--cond);font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.ozet b{font-family:var(--cond);font-size:25px;font-weight:700;color:var(--mavi2)}
.grup{margin-bottom:14px}
.grup h3{font-family:var(--cond);font-size:18px;letter-spacing:.1em;text-transform:uppercase;color:var(--mavi2);
  margin:0 0 9px;border-bottom:2px solid rgba(21,128,61,.25);padding-bottom:6px;display:flex;justify-content:space-between;align-items:baseline}
.grup h3 small{color:var(--muted);font-size:13px;letter-spacing:.06em}
.gorev{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:14px;margin-bottom:9px;width:100%;text-align:left;box-shadow:var(--golge)}
.gorev:active{background:var(--surface2);transform:scale(.985)}
.gorev{transition:transform .12s ease}
.gorev.ok{opacity:.5}
.gorev .cb{flex:0 0 26px;height:26px;border:2px solid #CBD5E1;border-radius:9px;position:relative;background:#fff;transition:background .15s}
.gorev.ok .cb{background:#15803D;border-color:transparent}
.gorev.ok .cb::after{content:"✓";position:absolute;inset:0;text-align:center;line-height:24px;color:#fff;font-weight:700;font-size:17px}
.gorev .gk{font-family:var(--cond);font-size:21px;font-weight:700;flex:0 0 62px}
.gorev .gd{flex:1;min-width:0;font-size:13.5px;color:var(--muted)}
.gorev .gd b{color:var(--ink);font-weight:600}

.prow{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:11px;padding:9px 11px;margin-bottom:7px;width:100%;text-align:left}
.prow .pd{font-family:var(--cond);font-size:22px;font-weight:700;flex:0 0 44px;text-align:center}
.prow .pt{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.prow .pt b{color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.tag{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px 7px;
  font-family:var(--cond);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tag.tagAktif{background:#7C3AED;color:#fff;border-color:transparent;font-weight:700}
.tag[aria-pressed="true"]{background:linear-gradient(135deg,var(--mavi),var(--mavi2));color:#fff;border-color:transparent;font-weight:600}
.tuzgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:8px}
.tuzgrid label{margin:0 0 3px;font-size:13px}
.tuzgrid input{padding:9px 6px;text-align:center}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(15,23,42,.06);
  display:flex;padding:7px 8px calc(7px + env(safe-area-inset-bottom));gap:6px}
nav button{flex:1;background:none;border:none;padding:8px 2px 7px;font-family:var(--body);font-size:11.5px;font-weight:600;
  letter-spacing:.01em;color:var(--muted);border-radius:14px;transition:background .15s,color .15s}
nav button b{display:block;font-size:22px;line-height:1.15;margin-bottom:2px;font-weight:400}
nav button[aria-pressed="true"]{color:#15803D;background:rgba(21,128,61,.10)}
nav button:active{transform:scale(.96)}
.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:30;
  background:linear-gradient(135deg,var(--mavi),var(--yesil));
  color:#fff;border:none;border-radius:999px;padding:15px 22px 13px;font-family:var(--cond);font-size:17px;
  font-weight:700;letter-spacing:.08em;text-transform:uppercase;box-shadow:var(--golge-mavi)}

.panel{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;
  padding:env(safe-area-inset-top) 16px calc(40px + env(safe-area-inset-bottom));animation:up .2s ease}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.pbar{position:sticky;top:0;background:var(--bg);padding:14px 0 12px;display:flex;align-items:center;
  justify-content:space-between;gap:12px;z-index:2}
.pbar h2{font-family:var(--cond);font-size:23px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin:0;
  background:linear-gradient(90deg,var(--mavi2),var(--yesil2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
label{display:block;font-family:var(--cond);font-size:14.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);margin:14px 0 5px}
input,select,textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;
  font-family:var(--body);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#15803D;box-shadow:0 0 0 3px rgba(21,128,61,.13)}
textarea{min-height:110px;resize:vertical;font-family:ui-monospace,monospace;font-size:13px}
#ndIn{font-family:var(--body);font-size:16px;min-height:120px;line-height:1.45}
.two{display:flex;gap:10px}.two>div{flex:1;min-width:0}
.btn{width:100%;border:none;border-radius:14px;padding:15px;margin-top:16px;font-family:var(--body);font-size:15.5px;
  font-weight:600;letter-spacing:.01em;background:#15803D;color:#fff;box-shadow:var(--golge-mavi);
  transition:transform .12s ease,background .12s ease}
.btn:active{transform:scale(.98);background:#166534}

const FB_ADRESLER = [

  'https://tank-takip-default-rtdb.us-central1.firebasedatabase.app'
];

const FB_ANAHTAR = 'z5oXxToTjS4fCW1vgcIrYjjMseBwS7z8';
let fbAdresIdx = 0;
try{ const s=localStorage.getItem('tanktakip:fbAdres'); if(s!==null && FB_ADRESLER[+s]) fbAdresIdx=+s; }catch(e){}
let FIREBASE_URL = FB_ADRESLER[fbAdresIdx];

function fbAdresDegistir(){
  const eski=fbAdresIdx;

  try{ localStorage.setItem('tanktakip:fbAdres',String(fbAdresIdx)); }catch(e){}

  const ayrac = yol.includes('?') ? '&' : '?';

  let sonHata=null;
  for(let deneme=0; deneme<FB_ADRESLER.length; deneme++){
    try{
      return await fetch(FIREBASE_URL.replace(/\/$/,'')+tamYol, opt);

/* İki listeyi kimliğe göre birleştir — hiçbir kayıt kaybolmasın */
function diziBirlestir(a, b, anahtar){
  const out=[], gorulen=new Set();
  [...(Array.isArray(a)?a:[]), ...(Array.isArray(b)?b:[])].forEach(x=>{
    if(!x || typeof x!=='object') return;
    const k=anahtar(x);
    if(gorulen.has(k)) return;
    gorulen.add(k); out.push(x);
  });
  return out;
}
/* Aynı tankın iki kopyasını birleştir: notlar/ölçümler/kimyasallar/log toplanır */
function tankBirlestir(yerel, bulut){
  if(!bulut) return yerel;
  /* PARTİ NUMARASI: yeniden doldurma her seferinde artar. Elimdeki parti
     buluttakinden yeniyse bu tank sıfırdan başlatılmış demektir — buluttaki
     eski partinin verileriyle BİRLEŞTİRME yapılmaz, yerel olduğu gibi kazanır.
     (Yoksa sıfırlanan notlar/ölçümler ve silinen "kapatıldı" işareti geri gelir.) */
  const yParti=+(yerel.parti||1), bParti=+(bulut.parti||1);
  if(yParti > bParti) return {...yerel};
  if(bParti > yParti) return {...bulut};
  const t={...bulut, ...yerel};                    // düz alanlarda elimdeki kazanır
  t.notlar2   = diziBirlestir(yerel.notlar2,   bulut.notlar2,   n=>n.id||n.m);
  t.olcumler  = diziBirlestir(yerel.olcumler,  bulut.olcumler,  o=>(o.tarih||'')+'|'+(o.ph||'')+'|'+(o.tuz||'')+'|'+(o.saat||''));
  t.kimyasallar = diziBirlestir(yerel.kimyasallar, bulut.kimyasallar, x=>(x.tarih||'')+'|'+(x.ad||'')+'|'+(x.miktar||''));
  t.log       = diziBirlestir(yerel.log,       bulut.log,       l=>(l.t||'')+'|'+(l.s||'')+'|'+(l.a||'')+'|'+(l.y||''));
  if(t.log && t.log.length>30) t.log.length=30;
  t.gecmis    = diziBirlestir(yerel.gecmis,    bulut.gecmis,    g=>(g.baslangic||'')+'|'+(g.urun||''));
  /* buluttaki not/ölçüm elimde yoksa bunlar geri gelmiş demektir */
  return t;
}
/* Eski sürümdeki cihazlar eski anahtarlara yazmaya devam ediyor.
   Oradaki YENİ kayıtları (onay/not/ölçüm/tank) alıp v3'e ekle — hiçbir şey silme. */
async function eskiAlandanTopla(){
  if(!FIREBASE_URL || tankKaynak!=='bulut') return {onay:0,not:0,olcum:0,tank:0};
  const sonuc={onay:0,not:0,olcum:0,tank:0};
  try{
    const [eskiT, eskiI] = await Promise.all([fbGet(K_TANK_ESKI), fbGet(K_IS_ESKI)]);
    /* --- onaylar --- */
    if(eskiI && typeof eskiI==='object'){
      Object.keys(eskiI).forEach(tarih=>{
        const gun=eskiI[tarih]; if(!gun||typeof gun!=='object') return;
        const hedef=isemri[tarih]=isemri[tarih]||{};
        Object.keys(gun).forEach(k=>{
          if(hedef[k]!==undefined) return;
          if(onayGeriAlinan.has(tarih+'|'+k)) return;   // bilerek geri alınmış
          hedef[k]=gun[k]; sonuc.onay++;
        });
      });
    }
    /* --- tanklar: notlar, ölçümler, eksik tanklar --- */
    if(Array.isArray(eskiT) && eskiT.length){
      const har=new Map(); tanklar.forEach(t=>har.set(kodNormal(t.kod||''), t));
      eskiT.forEach(et=>{
        const t=har.get(kodNormal(et.kod||''));
        if(!t){
          if(!silinenler.has(et.id)){ et.kod=kodDuzelt(et.kod); tanklar.push(et); sonuc.tank++; }
          return;
        }
        const oncekiN=(t.notlar2||[]).length, oncekiO=(t.olcumler||[]).length;
        const m=tankBirlestir(t, et);
        t.notlar2=m.notlar2; t.olcumler=m.olcumler; t.kimyasallar=m.kimyasallar; t.log=m.log;
        sonuc.not   += Math.max(0,(t.notlar2||[]).length-oncekiN);
        sonuc.olcum += Math.max(0,(t.olcumler||[]).length-oncekiO);
      });
    }
  }catch(e){
    /* Bu fonksiyon eski cihazlardaki verileri kurtarıyor — sessiz kalırsa
       "veriler kayboldu" şikayeti geri gelir ama sebebi görünmez. */
    console.error('eskiAlandanTopla başarısız:', e);
  }
  return sonuc;
}
async function tankYaz(){
  if(!FIREBASE_URL){ try{ localStorage.setItem(K_TANK,JSON.stringify(tanklar)); }catch(e){} return false; }
  const d=await fbGetDurum(K_TANK);
  if(d.ok && Array.isArray(d.data)){
    const bulutHar=new Map();
    d.data.forEach(t=>{ if(t&&t.id) bulutHar.set(t.id,t); });
    const kodHar=new Map();
    d.data.forEach(t=>{ if(t&&t.kod) kodHar.set(kodNormal(t.kod),t); });
    /* 1) Ortak tankların alt kayıtlarını birleştir */
    let kurtarilanNot=0, kurtarilanOlcum=0;
    tanklar=tanklar.map(t=>{
      const b=bulutHar.get(t.id) || kodHar.get(kodNormal(t.kod||''));
      if(!b) return t;
      const oncekiNot=(t.notlar2||[]).length, oncekiOlcum=(t.olcumler||[]).length;
      const m=tankBirlestir(t,b);
      kurtarilanNot   += Math.max(0,(m.notlar2||[]).length - oncekiNot);
      kurtarilanOlcum += Math.max(0,(m.olcumler||[]).length - oncekiOlcum);
      return m;
    });
    /* 2) Tamamen eksik tankları geri ekle */
    const bendekiId=new Set(tanklar.map(t=>t.id));
    const bendekiKod=new Set(tanklar.map(t=>kodNormal(t.kod||'')));
    const geriGelen=d.data.filter(t=>
      !bendekiId.has(t.id) && !bendekiKod.has(kodNormal(t.kod||'')) && !silinenler.has(t.id));
    if(geriGelen.length){
      geriGelen.forEach(t=>{ if(t.kod) t.kod=kodDuzelt(t.kod); tanklar.push(t); });
    }
    const parca=[];
    if(geriGelen.length) parca.push(geriGelen.length+' tank');
    if(kurtarilanNot) parca.push(kurtarilanNot+' not');
    if(kurtarilanOlcum) parca.push(kurtarilanOlcum+' ölçüm');
    if(parca.length) toast(parca.join(' · ')+' buluttan korundu');
  }
  return await sSet(K_TANK,tanklar);
}

function programNormalize(p){
  if(!p||typeof p!=='object') return {};
  const out={};
  Object.keys(p).forEach(urun=>{
    const gunler=p[urun];
    if(!gunler||typeof gunler!=='object') return;
    const temiz={};
    Object.keys(gunler).forEach(k=>{
      const v=gunler[k];
      if(v===null||v===undefined) return;
      const d=parseInt(k,10);
      if(!d||d<1) return;
      const g=Array.isArray(v.g)? v.g.filter(Boolean) : (v.g?Object.values(v.g).filter(Boolean):[]);
      const tuz={};
      if(v.tuz&&typeof v.tuz==='object') Object.keys(v.tuz).forEach(s=>{ if(v.tuz[s]) tuz[s]=+v.tuz[s]; });
      temiz[d]={g,tuz};
    });
    out[urun]=temiz;
  });
  return out;
}

  if(!pd.ok){
    await onayDialog('Bulut Bağlantısı Yok',
      'Sunucudan veri alınamadı.\nHata: '+(pd.hata||'bilinmiyor')+
      '\n\nBu durumda cihazlar birbirini göremez; her telefon kendi kopyasını gösterir.\n\n'+
      'Çözüm: Firebase konsolunda Realtime Database → Rules bölümünü açıp izin kurallarını yayınla.','Anladım');
    return;
  }
  const [t,i,dv,pe,uh]=await Promise.all([fbGet(K_TANK),fbGet(K_IS),fbGet(K_DEV),fbGet(K_PERSONEL),fbGet(K_HEDEF)]);
  if(t!==undefined){ t.forEach(x=>{ if(x.kod) x.kod=kodDuzelt(x.kod); }); tanklar=t; }
  if(pd.data!==undefined) program=programNormalize(nesneCoz(pd.data));
  if(i!==undefined) isemri=i;
  if(dv!==undefined) devirdaimSure=dv;
  if(pe!==undefined) personel=pe;
  if(uh!==undefined) urunHedef=nesneCoz(uh);
  const ue=await fbGet(K_URUNES); if(ue!==undefined) urunEslesme=eslesmeCoz(ue);
  ciz();
  toast('Bulut ile eşitlendi');
}
function canliSenkronBaslat(){
  if(!FIREBASE_URL) return;
  setInterval(async()=>{
    if(document.getElementById('panel')) return;   // düzenleme sırasında araya girme
    if(document.hidden) return;                    // ekran kapalı/arka planda — boşuna veri çekme
    /* hafif kontrol: hiçbir cihaz bir şey yazmadıysa ağır veriyi indirme */
    const rev=await fbGet(K_REV);
    if(rev!==undefined && sonRev!==null && rev===sonRev) return;
    sonRev = (rev===undefined? sonRev : rev);
    const pd=await fbGetDurum(K_PROG);
    const [t,i,dv,pe]=await Promise.all([fbGet(K_TANK),fbGet(K_IS),fbGet(K_DEV),fbGet(K_PERSONEL)]);
    const p = pd.ok ? pd.data : undefined;
    if(dv!==undefined) devirdaimSure=dv;
    if(pe!==undefined) personel=pe;
    let degisti=false;
    const uh=await fbGet(K_HEDEF);
    if(uh!==undefined){ const uhC=nesneCoz(uh)||{}; if(JSON.stringify(uhC)!==JSON.stringify(urunHedef)){ urunHedef=uhC; degisti=true; } }
    const ue=await fbGet(K_URUNES);
    if(ue!==undefined){ const ueC=eslesmeCoz(ue); if(JSON.stringify(ueC)!==JSON.stringify(urunEslesme)){ urunEslesme=ueC; degisti=true; } }
    const na=await fbGet(K_NUMUNE_AYAR);
    if(na && typeof na==='object' && JSON.stringify(na)!==JSON.stringify(numuneAyar)){ numuneAyar=na; degisti=true; }
    if(t!==undefined){
      t.forEach(x=>{ if(x.kod){ const y=kodDuzelt(x.kod); if(y!==x.kod) x.kod=y; } });
      if(JSON.stringify(t)!==JSON.stringify(tanklar)){ tanklar=t; degisti=true; }
    }
    if(p!==undefined){ const pN=programNormalize(nesneCoz(p)); if(JSON.stringify(pN)!==JSON.stringify(program)){ program=pN; degisti=true; } }
    if(i!==undefined && JSON.stringify(i)!==JSON.stringify(isemri)){ isemri=i; degisti=true; }
    if(degisti){ if(qrGoruntuKod) cizTankIsEmri(qrGoruntuKod); else ciz(); }
  },30000);
}

/* ================= varsayılan program (Excel'den) =================

  const sef={};

  sef[15]={g:['B','U'],tuz:{}};
  sef[20]={g:['B','U'],tuz:{}};

  /* Acur */

  /* Çorbacı Biber: 2-7 devirdaim; 4 bakım; 8 bakım+ÜK; 15 bakım; 20 bakım+ÜK */
  const cor={};
  for(let d=2;d<=7;d++) cor[d]={g:['D'],tuz:{}};

  /* Erik Turşusu */
  P['Erik Turşusu']={1:{g:['U'],tuz:{}},2:{g:['U'],tuz:{}},3:{g:['D'],tuz:{}},4:{g:['D'],tuz:{}},
    5:{g:['U'],tuz:{}},6:{g:['D'],tuz:{}},7:{g:['U'],tuz:{}},8:{g:['D'],tuz:{}},9:{g:['D'],tuz:{}},15:{g:['U'],tuz:{}}};

  P['Diğer']={};
  return P;
}

const bugunISO=()=>new Date().toISOString().slice(0,10);
const gunFark=(a,b)=>{
  const da=new Date(a+'T00:00'), db=new Date(b+'T00:00');
  if(isNaN(da)||isNaN(db)) return 0;
  return Math.round((db-da)/86400000);
};
const kisaTarih=t=>{const d=new Date(t+'T00:00');return d.getDate()+'.'+(d.getMonth()+1)};

const seri=t=>(t.kod.match(/^[A-ZÇĞİÖŞÜ]/)||[''])[0];
/* Henüz kaydedilmemiş bir kod METNİNDEN seri harfini çıkar: "A-14" -> "A" */
const seriHarfiCikar=kod=>(String(kod||'').toLocaleUpperCase('tr').match(/^[A-ZÇĞİÖŞÜ]/)||[''])[0];

function durum(t){
  if(t.bosaltildi) return t.temizlendi? 'temiz' : 'dip';
  if(t.kapatildi) return 'hazir';            // hava kesildi, isi bitti = HAZIR
  const g=gun(t),h=(+t.hedefGun)||30;
  if(g>h) return 'gecti';                    // hedef gunu gecti ama hava hala acik
  if(g===h) return 'bugunKapanacak';         // tam bugun, havayi kes
  if(g>=h-2) return 'yakin';

}

/* ---- NOT FOTOĞRAFI: tank kaydına gömülmez, ayrı anahtarda tutulur.
   Tank kaydında sadece foto kimliği (birkaç bayt) durur — tank listesi
   çekilirken hiçbir fotoğraf inmez; foto yalnız o not açıldığında istenir. */
const K_FOTO_ON='tanktakip:foto:';   // + fotoId
function dosyayiSikistir(file, maxKenar, kalite){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let w=img.width, h=img.height;
      if(w>h && w>maxKenar){ h=Math.round(h*maxKenar/w); w=maxKenar; }
      else if(h>maxKenar){ w=Math.round(w*maxKenar/h); h=maxKenar; }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      resolve(cv.toDataURL('image/jpeg', kalite));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('görsel okunamadı')); };
    img.src=url;
  });
}
async function fotoYukle(file){
  const veriUrl=await dosyayiSikistir(file, 900, 0.6);   // ~80-150 KB
  const fotoId='f'+Date.now()+Math.random().toString(36).slice(2,7);
  await fbSet(K_FOTO_ON+fotoId, veriUrl);
  return fotoId;
}
async function fotoGetir(fotoId){
  if(!fotoId) return null;
  try{ return await fbGet(K_FOTO_ON+fotoId); }catch(e){ return null; }
}
async function fotoSil(fotoId){
  if(!fotoId) return;
  /* Sessiz kalırsa fotoğraf bulutta yetim kalır, kullanıcı fark etmez.
     Kritik değil ama console'a iz bırakmakta fayda var. */
  try{ await fbIstek('/'+encodeURIComponent(K_FOTO_ON+fotoId)+'.json', {method:'DELETE'}); }
  catch(e){ console.error('fotoSil başarısız:', fotoId, e); }
}

}

/* ---- AÇIK TANK (kısmi çekim yapıldı, yarım kaldı) ---- */
function acikMi(t){ return !!t.acik && !t.bosaltildi; }
function kalanKg(t){
  if(t.acik && t.acik.kalan!=null) return t.acik.kalan;
  const s=String(t.kapasite||'').replace(/[^0-9]/g,'');
  return s?+s:null;
}
function acikGun(t){ return (t.acik&&t.acik.tarih)? gunFark(t.acik.tarih,bugunISO()) : 0; }
/* Aynı üründen açık tanklar — en eski açılan önce */
function acikTanklar(urun){
  return tanklar.filter(t=>acikMi(t) && (!urun || t.urun===urun))
    .sort((a,b)=>String(a.acik.tarih).localeCompare(String(b.acik.tarih)));
}
async function tankAc(id){
  const t=tanklar.find(x=>x.id===id); if(!t) return;
  if(!onayYetkisi()) return;
  const mevcut=kalanKg(t);
  const v=await girdiDialog(t.kod+' — Ürün Çekildi',

function aktifTankBul(kod){ return tanklar.find(t=>t.kod===kod && !t.bosaltildi); }
function tankOzetMetni(t){

/* dolum uygula: geçmişi koruyarak */
function dolumYaz(t, veri, gecmisiKoru){
  if(!gecmisiKoru){
    /* ÖNCEKİ PARTİYİ TAM ARŞİVLE — ölçümler, numuneler, notlar, kimyasallar
       hepsi gecmis[] içinde saklanır; aktif tankta sıfırdan başlanır. */
    if(t.urun||t.baslangic){
      /* Tuz toplamı, eski urun/baslangic hâlâ üstteyken (Object.assign'dan önce) hesaplanmalı */
      const tz=tankToplamTuz(t);
      (t.gecmis=t.gecmis||[]).unshift({
        urun:t.urun, baslangic:t.baslangic, bitis:t.bosaltildi||bugunISO(),
        kapasite:t.kapasite,
        olcumSayi:(t.olcumler||[]).length,
        olcumArsiv:  (Array.isArray(t.olcumler)   && t.olcumler.length)   ? t.olcumler   : undefined,
        numuneArsiv: (Array.isArray(t.numune2)    && t.numune2.length)    ? t.numune2    : undefined,
        notArsiv:    (Array.isArray(t.notlar2)    && t.notlar2.length)    ? t.notlar2    : undefined,
        kimyasalArsiv:(Array.isArray(t.kimyasallar)&&t.kimyasallar.length)? t.kimyasallar: undefined,
        tuzToplamKg: tz.adet? tz.toplamKg : undefined, tuzAdet: tz.adet||undefined,
        kapatildi:t.kapatildi||'', bosaltan:t.bosaltan||''
      });
      if(t.gecmis.length>20) t.gecmis.length=20;
    }
    /* Aktif parti sıfırlanır — yeni tank gibi başlar */
    t.olcumler=[]; t.kimyasallar=[]; t.numune2=[]; t.notlar2=[];
  }
  Object.assign(t, veri);
  /* Silinen alanlar bulut birleştirmesinde geri gelmesin diye BOŞ DEĞER atanır
     (anahtar yerelde durmalı ki buluttakini ezsin). */
  t.bosaltildi=''; t.bosaltan=''; t.bosaltmaSaat='';
  t.temizlendi=''; t.temizleyen=''; t.temizlikSaat='';
  t.erkenBitiren=''; t.erkenTarih=''; t.hedefGunAsil=''; t.hedefDusuk='';
  /* YENİ PARTİ: önceki partinin "fermantasyon kapatıldı" durumu temizlenmeli,
     yoksa tank iş emrinde çıkmaz ve durumu hep "hazır" görünür. */
  t.kapatildi=''; t.kapatan=''; t.kapatmaSaat=''; t.kapanisKontrol=null;
  t.acik=null; t.numune=null;
  if(!gecmisiKoru) t.parti = (+(t.parti||1)) + 1;   // yeni parti damgası
  t.olcumler=t.olcumler||[]; t.kimyasallar=t.kimyasallar||[]; t.numune2=t.numune2||[];
}
function isEmriUret(tarih){
  const out=[];
  tanklar.forEach(t=>{
    if(t.bosaltildi) return;
    if(t.kapatildi) return;          // fermantasyon kapandi, gunluk is yok
    const g=gunTarihte(t,tarih);
    if(g<1) return;
    const up=program[programUrun(t.urun)];
    const p=up&&up[g];
    if(!p||!p.g||!p.g.length) return;
    const s=seri(t);
    out.push({t,g,gorevler:p.g.slice(),tuzKg:p.g.includes('T')?(p.tuz&&p.tuz[s]||null):null});
  });
  out.sort((a,b)=>a.t.kod.localeCompare(b.t.kod,'tr',{numeric:true}));
  return out;
}

/* ---- NUMUNE ALMA ----
   Programdan bağımsız: gün sayısı eşiği geçen HER aktif tanktan numune
   istenir (ürün fark etmez). Tank başına t.numune = {tarih, gun, kisi, saat} */
const NUMUNE_ESIK_VARSAYILAN = 10;
function numuneEsigi(){
  if(numuneAyar.esik!=null) return numuneAyar.esik;
  return NUMUNE_ESIK_VARSAYILAN;
}
/* Numune alınacak ÜRÜNLER — varsayılan: sadece Salatalık serisi.
   Program → Ayarlar'dan değiştirilebilir. Kavanozluk gibi bağlı ürünler
   kendi programUrun() kökü Salatalık'a bağlıysa otomatik dahil olur. */
const NUMUNE_URUN_VARSAYILAN = ['Salatalık No.1','Salatalık No.2','Salatalık No.3'];
function numuneUrunleri(){
  if(Array.isArray(numuneAyar.urunler)) return numuneAyar.urunler;
  return NUMUNE_URUN_VARSAYILAN.slice();
}
async function numuneAyarKaydet(){
  await fbSet(K_NUMUNE_AYAR, numuneAyar);
}
function numuneUrunKapsaminda(t){
  const liste=numuneUrunleri();
  if(!liste.length) return true;             // liste boşsa hepsi kapsamda
  const kok = programUrun(t.urun) || t.urun;  // Kavanozluk No.2 -> Salatalık No.2
  return liste.includes(t.urun) || liste.includes(kok);
}
/* Havası kesilmiş (kapatılmış) tank da numune bekleyebilir — iş bitse bile
   ürünün ömrü boyunca EN AZ BİR numune alınmış olması gerekiyor.
   Sadece boşaltılmış (dip/temiz) tanklar numune dışında kalır. */
function numuneGerekliMi(t){
  if(t.bosaltildi) return false;
  if(!numuneUrunKapsaminda(t)) return false;
  return gun(t) >= numuneEsigi();
}
/* Numune kaydı LİSTE — birden çok analiz tutulabilir (tarih, pH, tuz, asit, kim). */
function numuneListe(t){
  if(!Array.isArray(t.numune2)){
    t.numune2=[];
    if(t.numune && typeof t.numune==='object'){       // eski tek-kayıt alanını taşı
      t.numune2.push({id:'m0', tarih:t.numune.tarih, gun:t.numune.gun, kisi:t.numune.kisi, saat:t.numune.saat,
        ph:'', tuz:'', asit:'', not:''});
      delete t.numune;
    }
  }
  return t.numune2;
}
function numuneSayi(t){ return Array.isArray(t.numune2)? t.numune2.length : (t.numune?1:0); }
function numuneAlinmisMi(t){ return numuneSayi(t)>0; }
/* "Numune tamam" = en az bir kez alınmış VE son sonuç normal aralıkta.
   Son sonuç hâlâ sınır dışıysa (ya da hiç değer girilmemişse) tank tekrar
   numune bekleyen listesine düşer — sonuç normale gelene kadar sürer. */
function numuneTamamlandiMi(t){
  if(!numuneAlinmisMi(t)) return false;
  const son=sonNumune(t);
  if(!son) return false;
  if(numuneSapmaVar(son)) return false;          // sınır dışı -> tekrar gerekli
  const degerYok = !son.ph && !son.tuz && !son.asit;
  if(degerYok) return false;                     // değer hiç girilmemiş -> henüz sonuçlanmamış say
  return true;
}
/* Numune bekleyen tanklar: eşiği geçmiş VE (hiç alınmamış YA DA son sonucu
   hâlâ sınır dışı/değersiz) tanklar. */
function numuneBekleyenler(){
  return tanklar.filter(t=>numuneGerekliMi(t) && !numuneTamamlandiMi(t))
    .sort((a,b)=>gun(b)-gun(a));   // en çok bekleyen önce
}
async function numuneEkle(id, deger){
  const t=tanklar.find(x=>x.id===id); if(!t) return;
  if(!onayYetkisi()) return;
  const d=deger||{};
  numuneListe(t).unshift({id:'m'+Date.now(), tarih:bugunISO(), gun:gun(t), kisi:kullaniciAdi()||'—', saat:saatSimdi(),
    ph:d.ph||'', tuz:d.tuz||'', asit:d.asit||'', not:d.not||''});

}
async function numuneDuzenle(id, mid, deger){

  if(!onayYetkisi()) return;
  Object.assign(m, {ph:deger.ph||'', tuz:deger.tuz||'', asit:deger.asit||'', not:deger.not||''});
  m.duz={k:kullaniciAdi()||'—', t:bugunISO(), s:saatSimdi()};

/* Tankın N. gününe denk gelen takvim tarihi */
function gunTarihi(t, g){
  const d=new Date(String(t.baslangic)+'T00:00');
  if(isNaN(d)) return '';
  d.setDate(d.getDate() + (g-1));
  return d.toISOString().slice(0,10);
}
/* ATLANAN GÖREV TARAMASI — gün sınırı yok.
   Programda tanımlı ama tankın o gününde onaylanmamış tüm görevleri bulur.
   Programa sonradan görev eklendiğinde, o günü çoktan geçmiş tanklar da çıkar. */
function atlananGorevler(gorevKodu, urunFiltre){
  const out=[];
  tanklar.forEach(t=>{
    if(t.bosaltildi) return;
    if(urunFiltre && urunFiltre!=='hepsi' && (t.urun||'—')!==urunFiltre) return;
    const up=program[programUrun(t.urun)];
    if(!up) return;
    const bugunG=gun(t);
    const s=seri(t);
    Object.keys(up).map(Number).filter(g=>!isNaN(g)).sort((a,b)=>a-b).forEach(g=>{
      if(g>bugunG) return;                       // bu güne daha gelmedi
      const pr=up[g]; if(!pr) return;
      const kodlar=pr.g||[];
      const kabul = gorevKodu==='DEV' ? kodlar.some(k=>DEVIR_KODLARI.includes(k)) : kodlar.includes(gorevKodu);
      if(!kabul) return;
      const gercekKod = gorevKodu==='DEV' ? kodlar.find(k=>DEVIR_KODLARI.includes(k)) : gorevKodu;
      const tarih=gunTarihi(t,g);
      if(!tarih) return;
      if((isemri[tarih]||{})[t.id+':'+gercekKod]) return;   // zaten onaylı
      out.push({t, gun:g, tarih, kod:gercekKod,
        tuzKg: gercekKod==='T' ? (pr.tuz && pr.tuz[s]) || null : null});
    });
  });
  return out.sort((a,b)=> (gun(b.t)-b.gun) - (gun(a.t)-a.gun) || a.t.kod.localeCompare(b.t.kod,'tr',{numeric:true}));
}
function gecikenIsler(bugunTarih, gunGeri){
  const out=[];
  for(let i=1;i<=gunGeri;i++){
    const d=new Date(bugunTarih+'T00:00'); d.setDate(d.getDate()-i);
    const tarih=d.toISOString().slice(0,10);
    const done=isemri[tarih]||{};
    isEmriUret(tarih).forEach(x=>{
      x.gorevler.forEach(k=>{
        if(!done[x.t.id+':'+k]) out.push({...x, gorev:k, tarih});
      });
    });
  }
  return out;
}

/* ---------- tanklar ---------- */
function tankKg(t){
  /* açık tankta gerçek stok = kalan miktar */
  if(t.acik && !t.bosaltildi && t.acik.kalan!=null) return +t.acik.kalan||0;
  if(!t.kapasite) return 0;
  const m=t.kapasite.match(/([\d.,]+)\s*(kg|t)?/i);
  if(!m) return 0;
  let v=+m[1].replace(/[.,](?=\d{3}\b)/g,'').replace(',','.');
  if(isNaN(v)) return 0;
  if(m[2]&&m[2].toLowerCase()==='t') v*=1000;
  return v;
}
function bugunBakimRaporu(){
  // son 7 günün onaylı görevlerini kişi/saat ile topla
  const kayitlar=[];
  for(let i=0;i<7;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    const tarih=d.toISOString().slice(0,10);
    const done=isemri[tarih]||{};
    isEmriUret(tarih).forEach(x=>x.gorevler.forEach(k=>{
      const v=done[x.t.id+':'+k];
      if(v && typeof v==='object' && v.k){
        kayitlar.push({tarih, kod:x.t.kod, gorev:GOREV[k], kisi:v.k, saat:v.s||'', urun:x.t.urun||''});
      }
    }));
  }
  return kayitlar;
}

  });
  // Boş satır + özet

    satirlar.push([u, v.n, v.kg,'','','','']);

  const a=document.createElement('a');

/* Hedef gunu gecmis ama hala bosaltilmamis tanklar (dun ve oncesi) */
function kapanisBekleyenler(){
  const bug=bugunISO();
  return tanklar.filter(t=>{
    if(t.bosaltildi || t.kapatildi) return false;
    const g=gun(t), hg=t.hedefGun||30;
    if(g<=hg) return false;                       // henuz hedefe gelmemis (bugun dahil - yarindan itibaren uyarir)
    const kk=t.kapanisKontrol;
    if(kk && kk.tarih===bug) return false;        // bugun zaten karar verilmis
    return true;
  }).sort((a,b)=>(gun(b)-(b.hedefGun||30))-(gun(a)-(a.hedefGun||30)));
}
async function kapanisKarar(id, karar){
  const t=tanklar.find(x=>x.id===id); if(!t) return;
  const ad=kullaniciAdi()||'Yönetici';
  const sa=new Date().toTimeString().slice(0,5);
  if(karar==='kapandi'){
    const ok=await onayDialog(t.kod+' kapatıldı mı?',
      t.urun+' · '+gun(t)+'. gün (hedef '+(t.hedefGun||30)+')\n\nFermantasyon bitti olarak işaretlenecek.\nTank dolu kalır, günlük görev üretmez.\nBoşaltma ayrı bir işlem.','Kapatıldı');
    if(!ok) return;
    t.kapatildi=bugunISO(); t.kapatan=ad; t.kapatmaSaat=sa;
    t.kapanisKontrol={tarih:bugunISO(), karar:'kapandi', kisi:ad, saat:sa};
  }else{
    const ek=await girdiDialog(t.kod+' devam ediyor',
      'Kaç gün daha bekleyecek? (boş bırakırsan sadece bugünlük ertelenir)','sayı');
    if(ek===null) return;
    const g=parseInt(ek,10);
    if(g>0) t.hedefGun=(t.hedefGun||30)+g;
    t.kapanisKontrol={tarih:bugunISO(), karar:'devam', kisi:ad, saat:sa, eklenen:(g>0?g:0)};
  }
  await tankYaz();
  ciz();
  toast(t.kod+' · '+(karar==='kapandi'?'kapatıldı':'devam ediyor'));
}
/* Kapanis paneli yuzunden YANLISLIKLA bosaltilmis tanklar */
function yanlisBosaltilanlar(){
  return tanklar.filter(t=>t.bosaltildi && t.kapanisKontrol &&
    t.kapanisKontrol.karar==='kapandi' && t.kapanisKontrol.tarih===t.bosaltildi);
}
async function yanlisBosaltmaGeriAl(){

    liste.length+' tank yanlışlıkla boşaltılmış görünüyor:\n'+
    liste.slice(0,15).map(t=>'• '+t.kod+' ('+(t.urun||'')+')').join('\n')+
    (liste.length>15?'\n… ve '+(liste.length-15)+' tank daha':'')+
    '\n\nBunlar tekrar DOLU hale gelecek ve "Kapatıldı" olarak işaretlenecek.','Geri Al');
  if(!ok) return;
  liste.forEach(t=>{
    const kk=t.kapanisKontrol;
    t.bosaltildi=''; t.bosaltan=''; t.bosaltmaSaat='';

  ciz();
  toast(liste.length+' tank geri alındı · kapatıldı olarak işaretlendi');
}

function urunOzeti(){
  const o={};
  tanklar.forEach(t=>{
    if(t.bosaltildi) return;
    const u=t.urun||'—';
    if(!o[u]) o[u]={adet:0,kg:0};
    o[u].adet++; o[u].kg+=tankKg(t);
  });
  return Object.entries(o).sort((a,b)=>b[1].kg-a[1].kg);
}
function toplamKg(){
  let kg=0;
  tanklar.forEach(t=>{ if(!t.bosaltildi) kg+=tankKg(t); });
  return Math.round(kg);
}
function cizTanklar(){
  const say={hepsi:0,hazir:0,yakin:0,gecti:0,dip:0,temiz:0,erken:0,bugun:0,acik:0,notlu:0};
  tanklar.forEach(t=>{
    if(t.bosaltildi){ if(t.temizlendi) say.temiz++; else say.dip++; return;}
    say.hepsi++; const d=durum(t); if(say[d]!==undefined) say[d]++;
    if(t.erkenBitiren) say.erken++;
    if(acikMi(t)) say.acik++;
    if(notSayi(t)) say.notlu++;
    if(d==='bugunKapanacak') say.bugun++;
  });
  const kgToplam=toplamKg();
  document.getElementById('hdr').innerHTML=`
    <div class="top"><h1>🧪 Tanklar</h1><button class="icon" id="btnOkut">Okut</button>${yonetici?'<button class="icon" id="btnQR">QR</button><button class="icon" id="btnHizli">Hızlı Ekle</button><button class="icon" id="btnExcel">📊 Excel</button><button class="icon" id="btnAnaliz">🧪 Analiz</button>'+(veriYuklendi?'':'<button class="icon" id="btnVeri">Veri Yükle</button>')+'<button class="icon" id="btnYedek">Yedek</button>':''}<button class="icon" id="btnKilit">${yonetici?'🔓':'🔒'}</button></div>
    <input id="ara" placeholder="Tank ara: A-14, biber…" value="${arama}" autocomplete="off">
    <div class="chips">${[['hepsi','Aktif'],...(notYetkisi()?[['notlu','📝 Notlu']]:[]),['acik','🔓 Açık'],['erken','⬇ Erken'],['hazir','Hazır'],['bugun','📅 Bugün Kapanacak'],['yakin','Yaklaşan'],['gecti','Geçen'],['dip','🧽 Temizlenecek'],['temiz','✓ Temiz']]
      .map(([k,ad])=>`<button class="chip" data-f="${k}" aria-pressed="${filtre===k}">${ad}<b>${say[k]||0}</b></button>`).join('')}`;
  document.getElementById('btnKilit').onclick=yoneticiGirisi;
  document.getElementById('btnOkut').onclick=qrOku;
  if(yonetici){
    document.getElementById('btnYedek').onclick=yedek;
    if(!veriYuklendi){ document.getElementById('btnVeri').onclick=gercekVeriYukle; }
    document.getElementById('btnHizli').onclick=hizliEkle;
    const bx=document.getElementById('btnExcel'); if(bx) bx.onclick=excelYukle;
    const ba=document.getElementById('btnAnaliz'); if(ba) ba.onclick=analizYukle;
    document.getElementById('btnQR').onclick=qrOlustur;
  }
  document.getElementById('ara').oninput=e=>{ arama=e.target.value; tankListesiCiz(); };
  document.getElementById('hdr').querySelector('.chips').onclick=e=>{
    const b=e.target.closest('.chip'); if(b){filtre=b.dataset.f;cizTanklar();}
  };

  tankListesiCiz();
}
function tankListesiCiz(){
  const q=arama.trim().toLocaleLowerCase('tr');
  let liste=tanklar.filter(t=>{
    if(q && !((t.kod+' '+(t.urun||'')).toLocaleLowerCase('tr').includes(q))) return false;
    if(filtre==='dip') return !!t.bosaltildi && !t.temizlendi;
    if(filtre==='temiz') return !!t.bosaltildi && !!t.temizlendi;
    if(filtre==='notlu') return notSayi(t)>0;
    if(t.bosaltildi) return false;
    if(filtre==='hepsi') return true;
    if(filtre==='acik') return acikMi(t);
    if(filtre==='erken') return !!t.erkenBitiren;
    if(filtre==='bugun') return durum(t)==='bugunKapanacak';
    if(filtre==='hazir') return durum(t)==='hazir';
    if(filtre==='gecti') return durum(t)==='gecti';
    return durum(t)===filtre;
  });
  const sira={gecti:0,bugunKapanacak:1,hazir:2,yakin:3,devam:4,dip:5,temiz:6};
  liste.sort((a,b)=>(acikMi(b)?1:0)-(acikMi(a)?1:0)||(b.erkenBitiren?1:0)-(a.erkenBitiren?1:0)||sira[durum(a)]-sira[durum(b)]||a.kod.localeCompare(b.kod,'tr',{numeric:true}));

  document.getElementById('ekran').innerHTML = liste.length ? liste.map(t=>{
    const g=gun(t),d=durum(t);
    const yuzde=Math.max(6,Math.min(100,Math.round(g/ +t.hedefGun*100)));
    const gcls=d==='gecti'?'g-late':(d==='yakin'||d==='bugunKapanacak')?'g-warn':(d==='hazir'?'g-ok':'');
    const son=(t.olcumler||[])[0];
    const phDeger=son&&son.ph?parseFloat(String(son.ph).replace(',','.')):null;
    const phKritik=phDeger!==null && phDeger>4.0;
    return `<button class="card st-${d} ${t.erkenBitiren?'kart-erken':''} ${phKritik?'ph-uyari':''}" data-id="${t.id}">
      <div class="gauge ${gcls}"><div class="cap"></div><div class="fill" style="height:${yuzde}%"></div><div class="gday">${g}</div></div>
      <div class="info">
        <div class="row1"><span class="kod">${t.kod}</span><span class="kap">${t.kapasite||''}</span></div>
        <div class="urun">${t.urun||'—'}</div>
        <div class="meta">
          ${t.erkenBitiren?`<span class="pill erkenPill">⬇ ERKEN ${t.hedefGun}G</span>`:''}
          <span class="pill ${SINIF[d]}">${ETIKET[d]}</span>
          <span class="pill">${g}/${t.hedefGun} gün</span>
          ${acikMi(t)?`<span class="pill acikPill">🔓 AÇIK${kalanKg(t)!=null?' · '+kalanKg(t)+' kg':''}</span>`:''}
          ${(numuneGerekliMi(t)&&!numuneTamamlandiMi(t)&&numuneAlinmisMi(t))?`<span class="pill numBekPill">🧪 Sonuç Sınır Dışı · Tekrar Gerekli</span>`:''}
          ${(numuneGerekliMi(t)&&!numuneAlinmisMi(t))?`<span class="pill numBekPill">🧪 Numune Bekliyor</span>`:''}
          ${numuneTamamlandiMi(t)?`<span class="pill numAlPill">🧪 Numune ${numuneSayi(t)>1?'x'+numuneSayi(t)+' · ':''}${kisaTarih(numuneListe(t)[0].tarih)}</span>`:''}
          ${(notYetkisi()&&notSayi(t))?`<span class="pill notPill">📝 ${notSayi(t)}</span>`:''}
        </div>
        ${son?`<div class="olcumGrid">
          <div><span>pH</span><b class="${phKritik?'uyari':''}">${son.ph||'—'}</b></div>
          <div><span>Tuz %</span><b>${son.tuz||'—'}</b></div>
          <div><span>Sıcaklık</span><b>${son.sicaklik?son.sicaklik+'°':'—'}</b></div>
        </div>`:''}
      </div>
      <div class="dolumKolon">
        <span class="dEtiket">DOLUM</span>
        <span class="dTarih">${kisaTarih(t.baslangic)}</span>
      </div>
    </button>`;
  }).join('') : `<div class="empty"><b>Kayıt yok</b>${q?'Arama sonucu boş.':'+ Tank ile dolum kaydı aç.'}</div>`;
  document.getElementById('ekran').onclick=e=>{
    const c=e.target.closest('.card'); if(c) detay(c.dataset.id);
  };
}
document.getElementById('fab').onclick=()=>form();

/* ---------- iş emri ---------- */
function cizIsEmri(){
  if(!ieTarih) ieTarih=bugunISO();
  const hepsiListe=isEmriUret(ieTarih);
  /* geçmişte yapılmamış işler — chip ve filtre kararları buna da baksın */
  const gecikTumu=(ieTarih===bugunISO())?gecikenIsler(ieTarih,7):[];
  const urunSay={};
  hepsiListe.forEach(x=>{ const u=x.t.urun||'—'; urunSay[u]=(urunSay[u]||0)+1; });
  const urunAdlari=Object.keys(urunSay).sort();
  const gecikUrunler=new Set(gecikTumu.map(x=>x.t.urun||'—'));
  if(ieUrun!=='hepsi' && !urunAdlari.includes(ieUrun) && !gecikUrunler.has(ieUrun)) ieUrun='hepsi';
  const liste = ieUrun==='hepsi' ? hepsiListe : hepsiListe.filter(x=>(x.t.urun||'—')===ieUrun);
  const done=isemri[ieTarih]||{};
  /* gecikmiş satırın onayı kendi tarihine yazılır */
  const doneAl=(x,k)=> x._gecikme ? ((isemri[x._gecikme]||{})[x.t.id+':'+k]) : done[x.t.id+':'+k];
  const grupHepsi={};
  liste.forEach(x=>x.gorevler.forEach(k=>{(grupHepsi[k]=grupHepsi[k]||[]).push(x);}));
  const gorevTipleri=GOREV_SIRA.filter(k=>grupHepsi[k]);
  const gecikKodlar=new Set(gecikTumu.map(x=>x.gorev));
  const gecikVar=k=> k==='DEV' ? DEVIR_KODLARI.some(d=>gecikKodlar.has(d)) : gecikKodlar.has(k);
  if(ieGorev==='GEC'){ if(!gecikTumu.length) ieGorev='hepsi'; }
  else if(ieGorev==='NUMUNE'){ if(!numuneBekleyenler().length) ieGorev='hepsi'; }
  else if(ieGorev!=='hepsi' && !grupHepsi[ieGorev] && !gecikVar(ieGorev)) ieGorev='hepsi';
  let grup = ieGorev==='hepsi' ? grupHepsi
           : (ieGorev==='GEC'||ieGorev==='NUMUNE') ? {}
           : (grupHepsi[ieGorev] ? {[ieGorev]:grupHepsi[ieGorev]} : {});
  // devirdaim kodlarını (D/D2/DV) tek başlık altında birleştir
  const devVar=DEVIR_KODLARI.filter(k=>grup[k]);
  if(devVar.length){
    const birlesik=[];
    devVar.forEach(k=>{ (grup[k]||[]).forEach(x=>birlesik.push({...x, _kod:k})); });
    birlesik.sort((a,b)=>a.t.kod.localeCompare(b.t.kod,'tr',{numeric:true}));
    const yeni={DEV:birlesik};
    Object.keys(grup).forEach(k=>{ if(!DEVIR_KODLARI.includes(k)) yeni[k]=grup[k]; });
    grup=yeni;
  }
  let toplamGorev=0, bitti=0, tuzToplam=0;
  Object.entries(grupHepsi).forEach(([k,arr])=>{
    if(ieUrun!=='hepsi' && !arr.some(x=>x.t.urun===ieUrun)) return;
    arr.forEach(x=>{
      if(ieUrun!=='hepsi' && x.t.urun!==ieUrun) return;
      toplamGorev++;
      if(done[x.t.id+':'+k]) bitti++;
      if(k==='T') tuzToplam+=(x.tuzKg||0);
    });
  });

  document.getElementById('hdr').innerHTML=`
    <div class="top"><h1>İş Emri</h1><button class="icon" id="btnOkut">Okut</button><button class="icon" id="btnRapor">Rapor</button><button class="icon" id="btnPay">Paylaş</button><button class="icon" id="btnKilit">${yonetici?'🔓':'🔒'}</button></div>
    <div class="iebar">
      <button class="icon" id="dG">‹</button>
      <input type="date" id="ieT" value="${ieTarih}">
      <button class="icon" id="dI">›</button>
    </div>
    ${urunAdlari.length>1?`<div class="chips" id="ieChips">
      <button class="chip" data-u="hepsi" aria-pressed="${ieUrun==='hepsi'}">Tümü<b>${hepsiListe.length}</b></button>
      ${urunAdlari.map(u=>`<button class="chip" data-u="${u}" aria-pressed="${ieUrun===u}">${u}<b>${urunSay[u]}</b></button>`).join('')}
    </div>`:''}
    ${(()=>{
      const gecSay=k=>gecikTumu.filter(x=>x.gorev===k && (ieUrun==='hepsi'||(x.t.urun||'—')===ieUrun)).length;
      const bugSay=k=>(grupHepsi[k]||[]).length;
      const chip=(k,ad)=>{
        const b=bugSay(k), g=gecSay(k);
        if(!b && !g) return '';
        return `<button class="chip" data-g="${k}" aria-pressed="${ieGorev===k}">${ad}<b>${b}${g?`<span class="gecSay">+${g}</span>`:''}</b></button>`;
      };
      const tuzC=chip('T','Sadece Tuz'), urunC=chip('U','🔍 Ürün Kontrol');
      const gecTop=gecikTumu.filter(x=>ieUrun==='hepsi'||(x.t.urun||'—')===ieUrun).length;
      const gecC = gecTop
        ? `<button class="chip chipGec" data-g="GEC" aria-pressed="${ieGorev==='GEC'}">⏰ Geciken İşler<b>${gecTop}</b></button>`
        : '';
      const numBek=numuneBekleyenler().filter(t=>ieUrun==='hepsi'||(t.urun||'—')===ieUrun).length;
      const numC = numBek
        ? `<button class="chip chipNum" data-g="NUMUNE" aria-pressed="${ieGorev==='NUMUNE'}">🧪 Numune Bekleyen<b>${numBek}</b></button>`
        : '';
      if(!tuzC && !urunC && !gecC && !numC) return '';
      return `<div class="chips gorevChips" id="ieGorevChips">
        <button class="chip" data-g="hepsi" aria-pressed="${ieGorev==='hepsi'}">Tüm işler</button>
        ${numC}${gecC}${tuzC}${urunC}
      </div>`;
    })()}`;
  if(document.getElementById('ieChips')){
    document.getElementById('ieChips').onclick=e2=>{
      const b=e2.target.closest('.chip'); if(b){ ieUrun=b.dataset.u; cizIsEmri(); }
    };
  }
  if(document.getElementById('ieGorevChips')){
    document.getElementById('ieGorevChips').onclick=e2=>{
      const b=e2.target.closest('.chip'); if(b){ ieGorev=b.dataset.g; cizIsEmri(); }
    };
  }
  document.getElementById('ieT').onchange=e=>{ieTarih=e.target.value||bugunISO();cizIsEmri();};
  document.getElementById('dG').onclick=()=>{const d=new Date(ieTarih+'T00:00');d.setDate(d.getDate()-1);ieTarih=d.toISOString().slice(0,10);cizIsEmri();};
  document.getElementById('dI').onclick=()=>{const d=new Date(ieTarih+'T00:00');d.setDate(d.getDate()+1);ieTarih=d.toISOString().slice(0,10);cizIsEmri();};
  document.getElementById('btnPay').onclick=()=>paylas(liste);
  document.getElementById('btnRapor').onclick=()=>gunSonuRaporu(liste,done);
  document.getElementById('btnOkut').onclick=qrOku;
  document.getElementById('btnKilit').onclick=yoneticiGirisi;

  const e=document.getElementById('ekran');
  if(!liste.length){
    /* Boş ekranda da onarım uyarısı görünmeli — asıl sorunu burada fark ediliyor */
    const kkBos=kapaliKalmisTanklar();
    e.innerHTML=
      ((kkBos.length&&yonetici)?`<button class="gecUyari" id="kapaliUyariBtn" style="background:#FFF7ED;border-color:#FDBA74">
        <span class="gecIkon">🔧</span>
        <span class="gecMetin"><b style="color:#9A3412">${kkBos.length} tank yanlışlıkla "kapalı" görünüyor</b>${kkBos.slice(0,5).map(t=>t.kod).join(', ')}${kkBos.length>5?'…':''} — yeniden dolduruldu ama iş emri çıkmıyor. Dokun ve düzelt</span>
        <span class="gecOk" style="color:#D97706">›</span>
      </button>`:'')
      + `<div class="empty"><b>Bu tarihte iş yok</b>${tanklar.some(t=>!t.bosaltildi)?'Programda bu güne görev tanımlı değil.':'Önce Tanklar sekmesinden dolum kaydı aç.'}</div>`;
    const kub=document.getElementById('kapaliUyariBtn');
    if(kub) kub.onclick=async()=>{
      const kk=kapaliKalmisTanklar();
      if(!kk.length) return;
      const ok=await onayDialog('Kapalı Kalmış Tankları Düzelt',
        kk.length+' tank yeniden dolduruldu ama eski partiden kalan "kapatıldı" işareti yüzünden iş emri çıkmıyor:\n\n'+
        kk.slice(0,10).map(t=>t.kod+' ('+(t.urun||'')+', '+gun(t)+'. gün)').join('\n')+
        (kk.length>10?`\n… ve ${kk.length-10} tank daha`:'')+
        '\n\nBu işaret kaldırılsın ve tanklar programa dahil olsun mu?','Düzelt');
      if(!ok) return;
      await kapaliKalmisDuzelt(kk);
      cizIsEmri(); toast(kk.length+' tank tekrar programa alındı');
    };
    return;
  }
  let gecikenler=gecikTumu.slice();
  /* aktif ürün / görev filtresine uy — "Ürün Kontrol" seçiliyken sadece o gecikmeler görünsün */
  if(ieUrun!=='hepsi') gecikenler=gecikenler.filter(x=>(x.t.urun||'—')===ieUrun);
  if(ieGorev!=='hepsi' && ieGorev!=='GEC'){
    const kabul = ieGorev==='DEV' ? DEVIR_KODLARI : [ieGorev];
    gecikenler=gecikenler.filter(x=>kabul.includes(x.gorev));
  }
  gecikenler.sort((a,b)=> a.tarih===b.tarih ? a.t.kod.localeCompare(b.t.kod,'tr',{numeric:true}) : (a.tarih<b.tarih?-1:1));
  e.innerHTML=`
    <div class="ozet">
      ${ieGorev==='GEC'
        ? `<div><span>Geciken</span><b style="color:var(--alarm)">${gecikenler.length}</b></div>
           <div><span>Tank</span><b>${new Set(gecikenler.map(x=>x.t.id)).size}</b></div>
           <div><span>Tuz</span><b>${gecikenler.reduce((n,x)=>n+(x.gorev==='T'?(x.tuzKg||0):0),0)||'—'}${gecikenler.some(x=>x.gorev==='T')?' kg':''}</b></div>`
        : ieGorev==='NUMUNE'
        ? (()=>{ const nb=numuneBekleyenler().filter(t=>ieUrun==='hepsi'||(t.urun||'—')===ieUrun);
            return `<div><span>Numune Bekleyen</span><b style="color:#7C3AED">${nb.length}</b></div>
              <div><span>${numuneEsigi()}+ gün</span><b>${nb.length?nb.length:'—'}</b></div>
              <div><span>En eski</span><b>${nb.length?gun(nb[0])+'. gün':'—'}</b></div>`; })()
        : `<div><span>Görev</span><b>${bitti}/${toplamGorev}</b></div>
           <div><span>Tank</span><b>${liste.length}</b></div>
           <div><span>Tuz</span><b>${tuzToplam?tuzToplam+' kg':'—'}</b></div>`}
    </div>
    ${(()=>{ const kk=kapaliKalmisTanklar(); return (kk.length&&yonetici)?`
      <button class="gecUyari" id="kapaliUyariBtn" style="background:#FFF7ED;border-color:#FDBA74">
        <span class="gecIkon">🔧</span>
        <span class="gecMetin"><b style="color:#9A3412">${kk.length} tank yanlışlıkla "kapalı" görünüyor</b>${kk.slice(0,5).map(t=>t.kod).join(', ')}${kk.length>5?'…':''} — yeniden dolduruldu ama iş emri çıkmıyor. Dokun ve düzelt</span>
        <span class="gecOk" style="color:#D97706">›</span>
      </button>`:''; })()}
    ${(ieGorev!=='GEC' && gecikTumu.length)?`
      <button class="gecUyari" id="gecUyariBtn">
        <span class="gecIkon">⏰</span>
        <span class="gecMetin"><b>${gecikTumu.length} iş geçmiş günlerden kalmış</b>Dokun ve tamamla</span>
        <span class="gecOk">›</span>
      </button>`:''}
    ${(ieGorev==='GEC'||ieGorev==='NUMUNE') ? ''
      : (bitti>=toplamGorev?`<div class="tamamRozet">✓ Bugünün işleri tamam${ieUrun!=='hepsi'?' — '+ieUrun:''}</div>`
      :(yonetici?`<button class="btn hepsiBtn" id="hepsiOnay">Tümünü Onayla · ${toplamGorev-bitti} görev${ieUrun!=='hepsi'?' ('+ieUrun+')':''}</button>`:''))}
    ${ieGorev==='NUMUNE' ? (()=>{
      const nb=numuneBekleyenler().filter(t=>ieUrun==='hepsi'||(t.urun||'—')===ieUrun);
      if(!nb.length) return '<div class="tamamRozet">✓ Numune bekleyen tank yok</div>';
      return `<div class="grup">
        <h3>🧪 Numune Bekleyen<small>${nb.length} tank${ieUrun!=='hepsi'?' · '+ieUrun:''}</small>
          <button class="tumuBtn" id="numTumu">Tümünü İşaretle ✓</button></h3>
        ${nb.map(t=>`<button class="gorev" data-numisaret="${t.id}">
            <span class="cb"></span>
            <span class="gk">${t.kod}</span>
            <span class="gd"><b>${gun(t)}. gün</b> · ${t.urun||''}</span>
          </button>`).join('')}
      </div>`;
    })() : ''}
    ${gecikenler.length?`
    <div class="grup gec">
      <h3 style="color:var(--alarm)">⏰ Yapılmayan İşler<small>${gecikenler.length} görev${(ieGorev!=='hepsi'&&ieGorev!=='GEC')?' · '+(ieGorev==='DEV'?'Devirdaim':(GOREV[ieGorev]||'')):''}${ieUrun!=='hepsi'?' · '+ieUrun:''}</small></h3>
      ${gecikenler.map(x=>{
        const key=x.t.id+':'+x.gorev;
        return `<button class="gorev" data-key="${key}" data-tarih="${x.tarih}" style="border-color:#6A2C25">
          <span class="cb"></span>
          <span class="gk">${x.t.kod}</span>
          <span class="gd"><b>${GOREV[x.gorev]}</b> · ${kisaTarih(x.tarih)} (${x.g}. gün) · <b style="color:var(--alarm)">${gunFark(x.tarih,bugunISO())} gün gecikti</b>${x.gorev==='T'&&x.tuzKg?` · <b>${x.tuzKg} kg</b>`:''} · ${x.t.urun||''}</span>
        </button>`;
      }).join('')}
    </div>`:''}
    ${GOREV_SIRA.filter(k=>grup[k]).map(k=>`
      <div class="grup">
        <h3>${k==='DEV'?'Devirdaim':GOREV[k]}<small>${grup[k].length} tank${k==='T'?' · '+grup[k].reduce((n,x)=>n+(x.tuzKg||0),0)+' kg':''}<button class="cokluBtn" data-cg="${k}">${cokluGorev===k?'✕ Vazgeç':'☑ Çoklu'}</button>${yonetici?` <button class="tumuBtn" data-g="${k}">Tümü ✓</button>`:''}</small></h3>
        ${cokluGorev===k?(()=>{
          const acik=(grup[k]||[]).filter(x=>!done[x.t.id+':'+(x._kod||k)]);
          const seriler=[...new Set(acik.map(x=>seri(x.t)))].sort();
          const tumKeys=(grup[k]||[]).map(x=>x.t.id+':'+(x._kod||k));
          const seciliSay=[...cokluSecim].filter(x=>tumKeys.includes(x)).length;
          return `<div class="cokluBar">
            <div class="cbSeriler">
              <button class="cbSec" data-cgtum="${k}">Tümü</button>
              ${seriler.map(s=>{
                const grupSeri=acik.filter(x=>seri(x.t)===s);
                const hepsiSecili=grupSeri.every(x=>cokluSecim.has(x.t.id+':'+(x._kod||k)));
                return `<button class="cbSeri ${hepsiSecili?'aktif':''}" data-cgseri="${k}|${s}">${s} <b>${grupSeri.length}</b></button>`;

function programSablonIndir(){
  const satirlar=[['Urun','Gun','GorevKodlari','GorevAdlari(bilgi)','TuzA','TuzB','TuzC','TuzD','TuzE']];
  Object.keys(program).forEach(u=>{
    const gunler=Object.keys(program[u]).map(Number).sort((a,b)=>a-b);
    gunler.forEach(d=>{
      const pr=program[u][d]||{};
      const kodlar=(pr.g||[]).join(',');
      const adlar=(pr.g||[]).map(k=>GOREV[k]||k).join(' + ');
      const tz=pr.tuz||{};
      satirlar.push([u,d,kodlar,adlar,tz.A||'',tz.B||'',tz.C||'',tz.D||'',tz.E||'']);
    });
  });
  satirlar.push([]);
  satirlar.push(['# GOREV KODLARI:']);
  Object.entries(GOREV).forEach(([k,v])=>satirlar.push(['# '+k,v]));
  satirlar.push(['# Not: Satir ekleyip silebilirsin. Yukleme mevcut programin yerine gecer.']);
  csvIndir('program-sablon-'+bugunISO()+'.csv', satirlar);
  toast('Şablon indirildi');
}
function csvSatirAyir(satir){
  const out=[]; let alan='', tirnak=false;
  for(let i=0;i<satir.length;i++){
    const ch=satir[i];
    if(tirnak){
      if(ch==='"'){ if(satir[i+1]==='"'){ alan+='"'; i++; } else tirnak=false; }
      else alan+=ch;
    }else{
      if(ch==='"') tirnak=true;
      else if(ch===';'||ch===','){ out.push(alan); alan=''; }
      else alan+=ch;
    }
  }
  out.push(alan);
  return out.map(x=>x.trim());
}
async function programSablonYukle(dosya){
  const metin=await dosya.text();
  const satirlar=metin.replace(/^\ufeff/,'').split(/\r?\n/).filter(s=>s.trim() && !s.trim().startsWith('#'));
  if(!satirlar.length){ toast('Dosya boş'); return; }
  const bas=csvSatirAyir(satirlar[0]).map(x=>x.toLocaleLowerCase('tr'));
  const sade=x=>String(x||'').replace(/[\s_.()]/g,'');
  const b=bas.map(sade);
  const iU=b.findIndex(x=>x==='urun'||x==='ürün');
  const iG=b.findIndex(x=>x==='gun'||x==='gün');
  /* görev kodu sütunu: önce tam ad, sonra 'kod' geçen ama tank kodu OLMAYAN */
  let iK=b.findIndex(x=>x==='gorevkodlari'||x==='görevkodları'||x==='gorevkod'||x==='kodlar');
  if(iK<0) iK=b.findIndex(x=>x.includes('kod') && !x.includes('tank') && !x.includes('hucre') && !x.includes('hücre'));
  /* yanlış dosya koruması: tank listesi / stok dökümü yüklenmesin */
  const tankListesiMi = b.some(x=>x.includes('tankkod')||x.includes('hucrekod')||x.includes('hücrekod'))
    || b.some(x=>x.includes('dolumtarih')) || b.some(x=>x.includes('hedefgun')||x.includes('hedefgün'));
  if(tankListesiMi){
    await onayDialog('Yanlış Dosya',
      'Bu bir TANK LİSTESİ dosyası gibi görünüyor, program şablonu değil.\n\n'+
      'Program şablonu için önce "📥 Şablon İndir" ile doğru dosyayı al, Excel\'de düzenleyip yükle.\n'+
      'Tank yüklemek istiyorsan: Tanklar → 📊 Excel','Tamam');
    return;
  }
  if(iU<0||iG<0||iK<0){
    await onayDialog('Başlık Tanınmadı',
      'Gerekli sütunlar bulunamadı.\n\nBeklenen: Urun · Gun · GorevKodlari\nBulunan: '+bas.join(' | '),'Tamam');
    return;
  }
  const iT={A:bas.findIndex(x=>x==='tuza'),B:bas.findIndex(x=>x==='tuzb'),C:bas.findIndex(x=>x==='tuzc'),D:bas.findIndex(x=>x==='tuzd'),E:bas.findIndex(x=>x==='tuze')};
  const yeni={}; let satirSay=0, hata=0;
  satirlar.slice(1).forEach(s=>{
    const a=csvSatirAyir(s);
    const urun=a[iU]; const d=parseInt(a[iG],10);
    if(!urun||!d||d<1){ if(a.some(x=>x)) hata++; return; }
    const kodlar=(a[iK]||'').split(/[,+ ]+/).map(x=>x.trim().toUpperCase()).filter(x=>x && GOREV[x]);
    const tuz={};
    ['A','B','C','D','E'].forEach(s2=>{ const ix=iT[s2]; if(ix>=0){ const v=parseFloat((a[ix]||'').replace(',','.')); if(v>0) tuz[s2]=v; } });
    yeni[urun]=yeni[urun]||{};
    yeni[urun][d]={g:kodlar,tuz};
    satirSay++;
  });
  const urunSay=Object.keys(yeni).length;
  if(!urunSay){ toast('Geçerli satır bulunamadı'); return; }
  const ok=await onayDialog('Program Yükle',
    urunSay+' ürün · '+satirSay+' gün satırı okundu'+(hata?' ('+hata+' satır atlandı)':'')+
    '.\n\nMevcut programın YERİNE geçecek. Devam?', 'Yükle');
  if(!ok) return;
  program=yeni;
  await progKaydet();
  cizProgram();
  toast(satirSay+' gün yüklendi');
}
/* ---------- ANALİZ (deneme) ---------- */
const NUMUNE_NORMAL_VARSAYILAN = {ph:[3.4,4.2], tuz:[5.0,7.5], asit:[0.5,1.2]};
function numuneNormal(){
  const n=numuneAyar.normal;
  /* Bozuk/anlamsız kayıt (ör. [0,0] veya min>=maks) varsayılana düşer —
     eski bir kayıt yüzünden her değer yanlışlıkla "sapan" görünmesin. */
  const gecerli=(ar)=>Array.isArray(ar) && ar.length===2 && ar.every(v=>typeof v==='number'&&!isNaN(v)) && ar[0]<ar[1];
  if(n && typeof n==='object' && gecerli(n.ph) && gecerli(n.tuz) && gecerli(n.asit)) return n;
  return NUMUNE_NORMAL_VARSAYILAN;
}
/* Tuz ve Asit ters girilmiş kayıtları bul.
   Turşuda tuz her zaman asitten yüksektir (tuz ~5-7%, asit ~0.5-1.2%).
   Tuz < Asit ise değerler kutuları karışmış demektir. */
/* Yeniden doldurulmuş ama eski partiden "kapatıldı" bayrağı üstünde kalmış tanklar.
   Belirti: tank dolu (boşaltılmamış) ve kapatma tarihi dolum tarihinden ÖNCE. */
function kapaliKalmisTanklar(){
  return tanklar.filter(t=>{
    if(t.bosaltildi || !t.kapatildi || !t.baslangic) return false;
    /* 1) Kapatma tarihi dolumdan ÖNCE — kesin eski partiden kalmış */
    if(String(t.kapatildi) < String(t.baslangic)) return true;
    /* 2) Kapatma dolumdan sonra ama tank hedef gününün çok başında.
       Fermantasyon normalde hedefe yaklaşınca kapatılır; 3. günde kapalı
       görünen tank yeniden doldurulmuş ama işaret temizlenmemiş demektir. */
    const g=gun(t), hg=(+t.hedefGun)||30;
    if(g < Math.min(hg-5, Math.round(hg*0.6))) return true;
    return false;
  });
}
async function kapaliKalmisDuzelt(liste){
  liste.forEach(t=>{ t.kapatildi=''; t.kapatan=''; t.kapatmaSaat=''; t.kapanisKontrol=null; });
  await tankYaz();
}
function tersNumuneler(){
  const out=[];
  tanklar.forEach(t=>{
    (numuneListe(t)||[]).forEach(m=>{
      const tz=ondalikSayi(m.tuz), as=ondalikSayi(m.asit);
      if(!isNaN(tz) && !isNaN(as) && tz < as) out.push({t, m, tuz:tz, asit:as});
    });
  });
  return out;
}
async function tersleriDuzelt(liste){
  liste.forEach(({m})=>{ const gecici=m.tuz; m.tuz=m.asit; m.asit=gecici; });
  await tankYaz();
}
function sonNumune(t){ const l=numuneListe(t); return l.length? l[0] : null; }
/* Depoda virgüllü ("3,80") ya da noktalı ("3.80") olabilir — ikisini de sayıya çevir. */
function ondalikSayi(v){
  if(v===''||v==null) return NaN;
  return parseFloat(String(v).trim().replace(',','.'));
}
function numuneSapmaVar(m){
  if(!m) return false;
  const n=numuneNormal();
  const disinda=(v,ar)=>{ const x=ondalikSayi(v); return !isNaN(x) && (x<ar[0] || x>ar[1]); };
  return disinda(m.ph,n.ph) || disinda(m.tuz,n.tuz) || disinda(m.asit,n.asit);
}
let anUrun='hepsi', anSirala='sapma';
let progGrup='urun';   // 'urun' | 'kalite' | 'sistem' — Program ekranının alt sekmesi
function cizAnaliz(){
  const e=document.getElementById('ekran');
  document.getElementById('hdr').innerHTML=`
    <div class="top"><h1>🧪 Analiz <span style="font-size:11px;font-weight:400;color:var(--muted)">(deneme)</span></h1>
      <button class="icon" id="btnKilit">${yonetici?'🔓':'🔒'}</button></div>`;
  document.getElementById('btnKilit').onclick=yoneticiGirisi;

  const numUrunTanklari = tanklar.filter(t=>!t.bosaltildi && numuneUrunKapsaminda(t));
  const numluTanklar = numUrunTanklari.filter(t=>numuneSayi(t)>0);
  const numsuzTanklar = numUrunTanklari.filter(t=>numuneSayi(t)===0);
  const urunAdlari=[...new Set(numluTanklar.map(t=>t.urun||'—'))].sort();

  const kayitlar = numluTanklar.map(t=>({t, m:sonNumune(t)}))
    .filter(x=>anUrun==='hepsi' || x.t.urun===anUrun);

  const degerler=(alan)=> kayitlar.map(x=>ondalikSayi(x.m[alan])).filter(v=>!isNaN(v));

        : '<p class="hint">Sınır dışı tank yok.</p>')

    kutu.id='anRaporKutusu';

    document.getElementById('anRaporPaylas').onclick=()=>{
      if(navigator.share) navigator.share({title:'Numune Raporu', text:metin}).catch(()=>{});

  };

  if(ng) ng.onclick=(ev)=>{ ev.preventDefault(); gorunum='isemri'; ieGorev='NUMUNE'; ciz(); };

      const ad=await girdiDialog('Personel Ekle','Onay verebilecek kişinin adı.','Örn: Gökhan');
      if(!ad) return;
      if(personel.includes(ad)){ toast('Zaten listede'); return; }
      personel.push(ad);
      await sSet(K_PERSONEL,personel); cizProgram(); toast(ad+' eklendi');
    };
  }
  if(yonetici && document.getElementById('sabIndir')){
    document.getElementById('sabIndir').onclick=programSablonIndir;
    document.getElementById('sabYukle').onclick=()=>document.getElementById('sabDosya').click();
    document.getElementById('sabDosya').onchange=async e=>{
      const f=e.target.files&&e.target.files[0];
      if(f) await programSablonYukle(f);
      e.target.value='';
    };
  }
  if(yonetici && document.getElementById('uhKaydet')){
    document.getElementById('uhKaydet').onclick=async()=>{
      const ayar={};
      ['A','B','C','D','E'].forEach(s=>{ const v=+document.getElementById('uh'+s).value; if(v>0) ayar[s]=v; });
      const gen=+document.getElementById('uhGenel').value; if(gen>0) ayar.genel=gen;
      if(!Object.keys(ayar).length){ toast('En az bir değer gir'); return; }
      const mevcutDa=document.getElementById('uhMevcut').checked;
      /* progUrun'e bağlı ürünler de (Kavanozluk No.2 gibi) aynı hedef gün ayarını
         kullanmalı — birebir isim değil, programUrun() ile çözülmüş kök karşılaştırılır. */
      const etkilenen=mevcutDa? tanklar.filter(t=>!t.bosaltildi&&programUrun(t.urun)===progUrun&&!t.erkenBitiren) : [];
      const ozet=['A','B','C','D','E'].filter(s=>ayar[s]).map(s=>s+': '+ayar[s]+'g').join(' · ')+(ayar.genel?(Object.keys(ayar).length>1?' · ':'')+'Genel: '+ayar.genel+'g':'');
      const ok=await onayDialog(progUrun+' — Hedef Gün',
        ozet+'\n\n'+(mevcutDa? 'Mevcut '+etkilenen.length+' aktif tanka da uygulanacak (erken hazır işaretliler korunur).' : 'Sadece bundan sonraki dolumlarda geçerli olacak; mevcut tanklar değişmeyecek.'),
        'Kaydet');
      if(!ok) return;
      urunHedef[progUrun]=ayar;
      let n=0;
      etkilenen.forEach(t=>{
        const s=seri(t);
        const yeniG = ayar[s] || ayar.genel;
        if(!yeniG) return;
        t.hedefDusuk = gun(t)>=yeniG ? true : '';
        t.hedefGun=yeniG; n++;
      });
      await hedefKaydet();
      if(n) await tankYaz();
      cizProgram();
      toast(progUrun+' kaydedildi'+(n?' · '+n+' tank güncellendi':''));
    };
  }
  if(yonetici && document.getElementById('dvKaydet')){
    document.getElementById('dvKaydet').onclick=async()=>{
      ['A','B','C','D','E'].forEach(s=>{
        const v=document.getElementById('dv'+s).value.trim();
        if(v) devirdaimSure[s]=v; else delete devirdaimSure[s];
      });
      await sSet(K_DEV,devirdaimSure);
      toast('Devirdaim süreleri kaydedildi');
    };
  }
  document.getElementById('ekran').onclick=e=>{
    if(!yonetici) return;
    if(e.target.closest('#gunEkle')){
      const d=prompt('Kaçıncı gün?');
      if(d&&+d>0){ programGun(+d); }
      return;
    }
    const r=e.target.closest('.prow'); if(r) programGun(+r.dataset.d);
  };
}

function programGun(d){
  const up=program[progUrun]=program[progUrun]||{};
  const p=up[d]||{g:[],tuz:{}};
  const pn=panel(`
    <div class="pbar"><h2>${progUrun} · ${d}. gün</h2><button class="icon" data-kapat>Kapat</button></div>
    <label>Görevler</label>
    <div class="tags">${GOREV_SIRA.filter(k=>k!=='DEV').map(k=>
      `<button class="tag" data-g="${k}" aria-pressed="${(p.g||[]).includes(k)}">${GOREV_PROG[k]}</button>`).join('')}</div>
    <label>Tuz miktarı (kg, seriye göre)</label>
    <div class="tuzgrid">${['A','B','C','D','E'].map(s=>
      `<div><label>${s}</label><input type="text" id="tz${s}" inputmode="decimal" value="${p.tuz&&p.tuz[s]||''}"></div>`).join('')}</div>
    <button class="btn" id="pKaydet">Kaydet</button>
    <button class="btn danger" id="pSil">Bu günü programdan sil</button>
  `);
  pn.querySelector('.tags').onclick=e=>{
    const b=e.target.closest('.tag'); if(!b) return;
    b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');
  };
  pn.querySelector('#pKaydet').onclick=async()=>{
    const g=[...pn.querySelectorAll('.tag[aria-pressed="true"]')].map(b=>b.dataset.g);
    const tuz={};
    ['A','B','C','D','E'].forEach(s=>{const v=ondalikSayi(pn.querySelector('#tz'+s).value);if(!isNaN(v)&&v)tuz[s]=v;});
    up[d]={g,tuz};
    program=programNormalize(program);
    await progKaydet(); kapat(); cizProgram(); toast(d+'. gün kaydedildi · diğer cihazlara gidiyor');
  };
  pn.querySelector('#pSil').onclick=async()=>{
    delete up[d];
    await progKaydet(); kapat(); cizProgram(); toast(d+'. gün silindi');
  };
}

/* ================= panel / form / detay ================= */
function panel(html){
  kapat();
  const p=document.createElement('div');p.className='panel';p.id='panel';p.innerHTML=html;
  document.body.appendChild(p);
  p.querySelectorAll('[data-kapat]').forEach(b=>b.onclick=kapat);
  return p;
}
const kapat=()=>{const p=document.getElementById('panel');if(p)p.remove();};

function form(id){
  const t=id?tanklar.find(x=>x.id===id):null;
  const us=urunler();
  const p=panel(`
    <div class="pbar"><h2>${t?'Tankı düzenle':'Yeni dolum'}</h2><button class="icon" data-kapat>Kapat</button></div>
    ${t?'':`<div class="seg"><button id="m1" aria-pressed="true">Tek tank</button><button id="m2" aria-pressed="false">Toplu ekle</button></div>`}
    <div id="tek">

    <button class="btn" id="f_kaydet">Kaydet</button>
    <p class="hint">1. gün = dolum günü. İş emri, ürünün programına göre otomatik çıkar.</p>
  `);
  const q=s=>p.querySelector(s);
  let mod='tek';
  /* Yeni tank eklerken (t yok) hedef günü ürüne+seriye göre otomatik doldur.
     Kullanıcı hedef alanını elle değiştirirse artık otomatik yazmayı bırak. */
  let hedefElleDegisti=false;
  q('#f_hedef').addEventListener('input', ()=>{ hedefElleDegisti=true; });
  function hedefOtoDoldur(){
    if(t || hedefElleDegisti) return;               // düzenleme modunda ya da elle değiştirilmişse dokunma
    const urun=q('#f_urun').value; if(!urun||urun==='__yeni__') return;
    const kodHam=(q('#f_kod')?q('#f_kod').value:'') || (q('#b_seri')?q('#b_seri').value:'');

    const hg=hedefGunHesapla(urun, s);
    if(hg) q('#f_hedef').value=hg;
    const ipucu=q('#f_hedefIpucu');
    if(ipucu && hg) ipucu.textContent='Programa göre önerilen: '+hg+' gün'+(s?' ('+s+' serisi)':'');

      const topluHedef = hedefElleDegisti ? (+q('#f_hedef').value||null) : null;
      let n=0;
      for(let i=b;i<=s;i++){
        const kod=kodDuzelt(sr+'-'+i);
        const buHedef = topluHedef || hedefGunHesapla(secilenUrun, sr) || ortak.hedefGun;
        const ortakBu = {...ortak, hedefGun:buHedef};
        if(tanklar.some(x=>kodNormal(x.kod)===kodNormal(kod)&&!x.bosaltildi)) continue;
        const bosTank=tanklar.find(x=>kodNormal(x.kod)===kodNormal(kod)&&x.bosaltildi);
        if(bosTank){ dolumYaz(bosTank,{kod,kapasite:kap,...ortakBu},false); }
        else tanklar.push({id:'t'+Date.now()+'_'+i,kod,kapasite:kap,...ortakBu,bosaltildi:'',olcumler:[],kimyasallar:[]});
        n++;
      }
      await tankYaz(); kapat(); ciz(); toast(n+' tank eklendi');

    }
    const kod=kodDuzelt(q('#f_kod').value);
    if(!kod){ q('#f_kod').focus(); return; }
    const veri={kod,kapasite:q('#f_kap').value.trim().toUpperCase(),...ortak};
    if(t){
      ['kod','urun','baslangic','hedefGun','kapasite'].forEach(a=>{
        if(veri[a]!==undefined) tankLog(t,a,t[a],veri[a],'Elle');
      });
      /* Dolum tarihi ileri alındıysa ya da ürün değiştiyse bu YENİ PARTİ demektir:
         önceki partiden kalan kapatma/boşaltma işaretleri temizlenmeli, yoksa
         tank iş emrine girmez. */
      const yeniParti = (veri.baslangic && veri.baslangic!==t.baslangic) || (veri.urun && veri.urun!==t.urun);
      Object.assign(t,veri);
      if(yeniParti){
        t.kapatildi=''; t.kapatan=''; t.kapatmaSaat=''; t.kapanisKontrol=null;
        t.bosaltildi=''; t.bosaltan=''; t.bosaltmaSaat='';
