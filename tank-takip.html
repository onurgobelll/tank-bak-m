        t.erkenBitiren=''; t.erkenTarih=''; t.hedefDusuk=''; t.acik=null;
        t.parti=(+(t.parti||1))+1;
      }
    }
    else tanklar.push({id:'t'+Date.now(),...veri,bosaltildi:'',olcumler:[],kimyasallar:[]});
    await tankYaz(); kapat(); ciz(); toast(t?'Güncellendi':'Tank eklendi');
  };
}

function kalanMetin(t){
  const hedef=new Date(t.baslangic+'T00:00');
  hedef.setDate(hedef.getDate()+(+t.hedefGun-1));
  const fark=hedef-new Date();
  const gunF=Math.floor(Math.abs(fark)/86400000);
  const saatF=Math.floor((Math.abs(fark)%86400000)/3600000);
  if(fark>=0) return `${gunF} gün ${saatF} saat kaldı`;
  return `${gunF} gün ${saatF} saat geçti`;
}
function phGrafik(t){
  const veriler=(t.olcumler||[]).filter(o=>o.ph).slice(0,10).reverse();
  if(veriler.length<2) return '';
  const phs=veriler.map(o=>+o.ph);
  const min=Math.min(...phs)-0.2, max=Math.max(...phs)+0.2;
  const W=300,H=80,P=6;
  const nokta=phs.map((v,i)=>{
    const x=P+i*(W-2*P)/(phs.length-1);
    const y=H-P-(v-min)/(max-min)*(H-2*P);
    return x.toFixed(1)+','+y.toFixed(1);
  });
  return `<div class="sec">pH Eğrisi<small style="float:right;font-size:12px">son ${phs.length} ölçüm</small></div>
  <div class="grafKutu" style="padding:8px">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      <polyline points="${nokta.join(' ')}" fill="none" stroke="var(--mavi)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${nokta.map((n,i)=>`<circle cx="${n.split(',')[0]}" cy="${n.split(',')[1]}" r="3.2" fill="var(--mavi)"/>`).join('')}
    </svg>
    <div style="display:flex;justify-content:space-between;font-family:var(--cond);font-size:12px;color:var(--muted);padding:0 4px">
      <span>${kisaTarih(veriler[0].tarih)} · ${phs[0]}</span>
      <span>${kisaTarih(veriler[veriler.length-1].tarih)} · ${phs[phs.length-1]}</span>
    </div>
  </div>`;
}
function tankBakimGecmisi(t, adet){
  const out=[];
  Object.entries(isemri).forEach(([tarih,gunKayit])=>{
    Object.entries(gunKayit).forEach(([key,v])=>{
      if(key.startsWith(t.id+':')){
        const kodG=key.slice(t.id.length+1);
        out.push({tarih, gorev:GOREV[kodG]||kodG, kod:kodG, kisi:(v&&v.k)||'', saat:(v&&v.s)||''});
      }
    });
  });
  out.sort((a,b)=>b.tarih.localeCompare(a.tarih));
  return out.slice(0,adet||10);
}
/* Bu tanka bugüne kadar onaylanmış TÜM Tuz görevlerinin toplam kg'ı
   (programdaki o günün/serinin tuz miktarına göre hesaplanır). */
function tankToplamTuz(t){
  const up=program[programUrun(t.urun)]||{};
  const s=seri(t);
  let toplam=0;
  const kayitlar=[];
  Object.entries(isemri).forEach(([tarih,gunKayit])=>{
    const kayit=gunKayit[t.id+':T'];
    if(!kayit) return;
    /* onaylandığı tarihteki fermantasyon gününü bul, o günün tuz değerini al.
       Kg değeri 0/boşsa o gün gerçekte tuz verilmemiş demektir — dökümde ve
       "kaç kez" sayısında yer almamalı (yalnız gösterge amaçlı olsa bile). */
    const g=gunFark(t.baslangic,tarih)+1;
    const pr=up[g];
    const kgHam=(pr && pr.tuz && pr.tuz[s]);
    const kg=(+kgHam)||0;
    if(!kg) return;   // 0 kg -> gerçek tuz verme değil, sayma
    toplam+=kg;
    kayitlar.push({gun:g, tarih, kg, kisi:(kayit&&kayit.k)||''});
  });
  kayitlar.sort((a,b)=>a.gun-b.gun);
  return {toplamKg:toplam, adet:kayitlar.length, kayitlar};
}

  const ty=q('#temizYap');
  if(ty) ty.onclick=async()=>{
    t.temizlendi=bugunISO(); t.temizleyen=kullaniciAdi(); t.temizlikSaat=saatSimdi();

  if(tdv) tdv.onclick=async()=>{
    const v=q('#t_dev').value.trim();

    detay(id);
    toast(v? t.kod+' devirdaim: '+v+' saat' : t.kod+' seri varsayılanına döndü');
  };
  q('#duzenle').onclick=()=>form(id);
  q('#sil').onclick=async()=>{
    if(!confirm(t.kod+' ve tüm ölçümleri silinsin mi?')) return;

    (t.notlar2||[]).forEach(n=>{ if(n.foto) fotoSil(n.foto); });

    tanklar=tanklar.filter(x=>x.id!==id); await tankYaz(); kapat(); ciz();
  };

/* ================= hızlı ekle (serbest metin, çoklu eylem) ================= */
/* Türkçe büyük harfleri güvenli küçült: İ→i, I→ı, Ş/Ç/Ğ/Ö/Ü */
function trKucuk(s){
  return String(s||'').replace(/İ/g,'i').replace(/I/g,'ı').toLowerCase();
}
/* "no2", "no.2", "no 2", "no2tank", "no:2" hepsini yakalar — sonrasında harf gelmesi sorun değil,
   ama "no21" gibi çok haneli sayıya takılmaz */
const noN = n => new RegExp('no\\s*[.:]?\\s*'+n+'(?![0-9])','i');
const URUN_DESENLERI=[
  /* kavanozluk + no.2 → ayrı isim, No.2 programına bağlı */
  {re:/kavanozluk/i, ek:noN(2), urun:'Kavanozluk No.2'},
  /* kelek + kavanozluk → ayrı isim, Kelek programına bağlı */
  {re:/kelek/i, ek:/kavanozluk/i, urun:'Kelek (Kavanozluk)'},
  {re:/salatal[ıi]k|tur[şs]u|no\s*[.:]?\s*1/i, ek:noN(1), urun:'Salatalık No.1'},
  {re:/salatal[ıi]k|tur[şs]u|no\s*[.:]?\s*2/i, ek:noN(2), urun:'Salatalık No.2'},
  {re:/salatal[ıi]k|tur[şs]u|no\s*[.:]?\s*3/i, ek:noN(3), urun:'Salatalık No.3'},
  {re:/domates/i, urun:'Domates'},
  {re:/lahana/i, urun:'Lahana'},
  {re:/kelek/i, urun:'Kelek'},
  {re:/havu[cç]/i, urun:'Havuç'},
  {re:/[şs]eftal/i, urun:'Şeftali Çağlası'},
  {re:/acur/i, urun:'Acur'},
  {re:/[cç]orbac[ıi]|\bbiber\b/i, urun:'Çorbacı Biber'},
  {re:/erik/i, urun:'Erik Turşusu'}
];
function hedefAyar(urun){
  const v=urunHedef[programUrun(urun)];
  if(v===undefined||v===null) return {};
  if(typeof v==='object') return v;
  return {genel:+v};                       // eski tek-sayı kayıtları
}
function hedefGunHesapla(urun, seriHarfi){
  const a=hedefAyar(urun);
  if(seriHarfi && a[seriHarfi]) return +a[seriHarfi];
  if(a.genel) return +a.genel;
  const up=program[programUrun(urun)];
  if(!up) return 30;
  const gunler=Object.keys(up).map(Number);
  return gunler.length? Math.max(...gunler)+3 : 30;
}
/* Tank kodunu karsilastirilabilir hale getir: A-9 / A9 / a-009 -> A-9 */
function kodNormal(k){
  const m=String(k||'').toUpperCase().replace(/\s+/g,'').match(/^([A-ZÇĞİÖŞÜ]{1,3})-?0*(\d{1,4})$/);
  return m ? m[1]+'-'+parseInt(m[2],10) : String(k||'').toUpperCase().replace(/\s+/g,'');
}
/* Tank kodunu tek biçime getir: A11 / A-11 / a-11 -> A-011 ; A-1150 -> A-1150 */
function kodDuzelt(k){
  const m=String(k||'').toLocaleUpperCase('tr').replace(/\s+/g,'')
    .match(/^([A-ZÇĞİÖŞÜ]{1,3})-?(\d{1,5})$/);
  if(!m) return String(k||'').toLocaleUpperCase('tr').replace(/\s+/g,'');
  const n=m[2].replace(/^0+/,'')||'0';
  return m[1]+'-'+(n.length<3 ? n.padStart(3,'0') : n);
}
function kodBul(s){
  let m=s.match(/^([^\s]+)\s+nolu\s+tank/i);
  if(m) return kodDuzelt(m[1]);
  m=s.match(/([A-ZÇĞİÖŞÜ]{1,3}-?\d{1,5})/i);
  return m? kodDuzelt(m[1]) : null;
}
function satirAyristir(satir){
  const s=satir.trim().replace(/[,;]+$/,'').trim();
  if(!s) return null;
  // tek kelimelik kapanış satırları (Dolduruldu, Tamamdır vb.) sessizce atlanır
  if(!/\s/.test(s) && !/-?\d/.test(s)) return null;
  const kod=kodBul(s);
  if(!kod) return {hata:true, satir:s, neden:'Tank kodu bulunamadı'};

  if(/bo[şs]alt/i.test(s)){
    return {hata:false, eylem:'bosalt', kod, satir:s};
  }
  if(/devirdaim/i.test(s) && /yap|tamam|bitti/i.test(s)){
    return {hata:false, eylem:'devirdaim', kod, satir:s};
  }
  const phM=s.match(/ph\s*:?\s*(\d+([.,]\d+)?)/i);
  const tuzM=s.match(/tuz\s*:?\s*(\d+([.,]\d+)?)/i);
  const sicM=s.match(/s[ıi]cakl[ıi]k\s*:?\s*(\d+([.,]\d+)?)/i);
  if(phM||tuzM||sicM){
    return {hata:false, eylem:'olcum', kod, satir:s,
      ph: phM?phM[1].replace(',','.'):null,
      tuz: tuzM?tuzM[1].replace(',','.'):null,
      sicaklik: sicM?sicM[1].replace(',','.'):null};
  }
  const km=s.match(/(\d[\d.,]*)\s*kg/i);
  const miktar=km? +km[1].replace(/[.,]/g,'') : null;
  const urun=urunTani(s);
  if(!urun) return {hata:true, satir:s, neden:'Ürün anlaşılamadı'};
  return {hata:false, eylem:'dolum', kod, urun, miktar, satir:s};
}

/* ================= EXCEL / CSV TANK YÜKLEME ================= */
function urunTani(metin){
  const s=trKucuk(metin);
  for(const d of URUN_DESENLERI){
    if(!d.re.test(s)) continue;
    if(d.ek && !d.ek.test(s)) continue;   // numara şart olan kalıp
    return d.urun;
  }
  /* salatalık yazmış ama numara okunamamış → tahmin etme, belirsiz dön */
  return null;
}
/* Ayrıştırılan ürün adını programdaki gerçek ada eşle */
function urunEsle(ad){
  if(!ad) return ad;
  if(program && program[ad]) return ad;
  const hedef=urunTani(ad)||ad;
  if(program && program[hedef]) return hedef;
  for(const k of Object.keys(program||{})){
    if(k===ad) return k;
    if(trKucuk(k)===trKucuk(ad)) return k;
    const kk=urunTani(k);
    if(kk && kk===hedef) return k;
  }
  return hedef;
}
function basligiTani(h){
  const s=String(h||'').toLocaleLowerCase('tr').replace(/\s+/g,'').replace(/\./g,'');
  // --- ERP (Hücre Kodu / Stok Adı / Seri Bakiye / Seri No) ---
  if(/h[üu]crekodu|tankkodu|tankno/.test(s)) return 'kod';
  if(/stokad|[üu]r[üu]nad|malad/.test(s)) return 'urun';
  if(/seribakiye|netbakiye|bakiye/.test(s)) return 'kg';
  if(/serino2/.test(s)) return null;
  if(/serino/.test(s)) return 'tarih';
  if(/stokkodu|yapkodu|depokodu/.test(s)) return null;
  // --- genel ---
  if(/hedef|s[üu]re/.test(s)) return 'hedef';
  if(/dolum|ba[şs]lang|tarih|giri[şs]/.test(s)) return 'tarih';
  if(/[üu]r[üu]n|cins|mal$/.test(s)) return 'urun';
  if(/kg|kilo|miktar|kapasite|tonaj/.test(s)) return 'kg';
  if(/^tank|^kod$/.test(s)) return 'kod';
  return null;
}
function tarihCevir(v){
  if(v===null||v===undefined||v==='') return null;
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
  m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})/);
  if(m){ let y=m[3]; if(y.length===2) y='20'+y;
    return y+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0'); }
  if(/^\d+(\.\d+)?$/.test(s)){ // Excel seri numarası
    const g=Math.floor(+s);
    if(g>20000&&g<80000){ const d=new Date(Date.UTC(1899,11,30)); d.setUTCDate(d.getUTCDate()+g); return d.toISOString().slice(0,10); }
  }
  return null;
}
function satirlariTanka(satirlar){
  if(!satirlar.length) return {kayitlar:[], hata:'Dosya boş'};
  let bas=-1, harita=null;
  for(let i=0;i<Math.min(10,satirlar.length);i++){
    const h={}; let sayac=0;
    satirlar[i].forEach((hc,j)=>{ const t=basligiTani(hc); if(t&&h[t]===undefined){ h[t]=j; sayac++; } });
    if(h.kod!==undefined && sayac>=2){ bas=i; harita=h; break; }
  }
  if(bas<0) return {kayitlar:[], hata:'Başlık satırı bulunamadı. Sütunlarda "Hücre Kodu"/"Tank", "Stok Adı"/"Ürün" gibi başlıklar olmalı.'};
  /* ERP'de "Seri Bakiye" ayrı sütun: negatifse o satır bir ÇIKIŞ hareketidir,
     tarihi dolum tarihi değildir */
  let iSeriBak=-1;
  satirlar[bas].forEach((h,j)=>{
    const s=String(h||'').toLocaleLowerCase('tr').replace(/\s+/g,'');
    if(iSeriBak<0 && /seribakiye/.test(s)) iSeriBak=j;
  });
  const kayitlar=[];
  let sonUrunHam='';   // ERP: ürün adı yalnız grubun ilk satırında yazar
  for(let i=bas+1;i<satirlar.length;i++){
    const r=satirlar[i]; if(!r||!r.length) continue;
    // ara toplam satırlarını atla
    if(r.some(h=>/^toplam$/i.test(String(h||'').trim()))) continue;
    if(harita.urun!==undefined){
      const u=String(r[harita.urun]||'').trim();
      if(u) sonUrunHam=u;
    }
    const kodHam=String(r[harita.kod]||'').trim();
    if(!kodHam) continue;
    const kod=kodBul(kodHam)||kodDuzelt(kodHam);
    if(!/^[A-ZÇĞİÖŞÜ]-?\d+/i.test(kod)) continue;
    const urunHam=sonUrunHam;
    let urun=null;
    if(urunHam){ urun=urunEsle(urunTani(urunHam) || urunHam); }
    const kgHam=harita.kg!==undefined? String(r[harita.kg]||'').replace(/[^\d]/g,'') : '';
    const tarih=harita.tarih!==undefined? tarihCevir(r[harita.tarih]) : null;
    const hedef=harita.hedef!==undefined? parseInt(String(r[harita.hedef]).replace(/[^\d]/g,''),10) : null;
    let cikisHareketi=false;
    if(iSeriBak>=0){
      const sb=parseFloat(String(r[iSeriBak]||'').replace(/\./g,'').replace(',','.'));
      if(!isNaN(sb) && sb<0) cikisHareketi=true;
    }
    kayitlar.push({kod, urun, kg:kgHam?+kgHam:null,
      tarih: cikisHareketi ? null : tarih,     // çıkış satırının tarihi dolum tarihi değil
      hedef:(hedef&&hedef>0&&hedef<200)?hedef:null,
      supheli: cikisHareketi ? ('çıkış hareketi ('+String(r[iSeriBak])+' kg) — tarih alınmadı') : null});
  }
  return {kayitlar, hata:kayitlar.length?null:'Geçerli tank satırı bulunamadı'};
}
function csvTumSatirlar(metin){
  return metin.split(/\r?\n/).filter(s=>s.trim()).map(satir=>{
    const ayrac = (satir.split(';').length > satir.split(',').length) ? ';' : ',';
    const out=[]; let cur='', tirnak=false;
    for(let i=0;i<satir.length;i++){
      const ch=satir[i];
      if(ch==='"'){ if(tirnak&&satir[i+1]==='"'){cur+='"';i++;} else tirnak=!tirnak; }
      else if(ch===ayrac && !tirnak){ out.push(cur); cur=''; }
      else cur+=ch;
    }
    out.push(cur);
    return out.map(s=>s.trim());
  });
}

/* ---- ANALİZ SONUÇLARI TOPLU YÜKLEME ----
   Excel: Tank | pH | Tuz | Asit sütunları — her satır bir tanka bir ölçüm ekler. */
function analizSatirTani(bas){
  const sade=x=>String(x||'').toLocaleLowerCase('tr').replace(/[\s_.()%\/]/g,'');
  const b=bas.map(sade);
  const iK=b.findIndex(x=>x.includes('tank')||x.includes('kod'));
  const iP=b.findIndex(x=>x==='ph');
  const iT=b.findIndex(x=>x.includes('tuz'));
  const iA=b.findIndex(x=>x.includes('asit')||x.includes('asitlik'));
  const iS=b.findIndex(x=>x.includes('sicaklik')||x.includes('sıcaklık')||x==='c'||x==='derece');
  const iN=b.findIndex(x=>x.includes('not')||x.includes('aciklama')||x.includes('açıklama'));
  /* Analiz tarihi: "ANALİZ TARİHİ" gibi — dolum/bidon tarihiyle karışmasın */
  const iAT=b.findIndex(x=>x.includes('analiztarih')||(x.includes('analiz')&&x.includes('tarih')));
  return {iK,iP,iT,iA,iS,iN,iAT};
}
/* Excel hücresinden tarihi ISO'ya çevir (Date objesi, "2026-08-14 00:00:00", "14.08.2026") */
function analizTarihCevir(v){
  if(v==null||v==='') return '';
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[1]+'-'+m[2]+'-'+m[3];
  m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);
  if(m) return m[3]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0');
  const d=new Date(s);
  return isNaN(d)? '' : d.toISOString().slice(0,10);
}

  `);
  const q=s=>p.querySelector(s);
  const isle=(satirlar)=>{
    const bas=(satirlar[0]||[]).map(x=>String(x||'').trim());
    const {iK,iP,iT,iA,iS,iN,iAT}=analizSatirTani(bas);
    if(iK<0){
      q('#an_sonuc').innerHTML='<p class="hint" style="color:var(--alarm)">Tank sütunu bulunamadı. Beklenen: Tank · pH · Tuz · Asit<br>Bulunan başlıklar: '+bas.join(' | ')+'</p>';
      return;
    }
    if(iP<0&&iT<0&&iA<0){
      q('#an_sonuc').innerHTML='<p class="hint" style="color:var(--alarm)">pH, Tuz veya Asit sütunlarından hiçbiri bulunamadı.</p>';
      return;
    }
    const bug=bugunISO();
    const eslesen=[], eslesmeyen=[], bosSatir=[], zatenVar=[], tankDisi=[];
    satirlar.slice(1).forEach(r=>{
      if(!r || !r[iK] || String(r[iK]).trim()==='') return;
      const kodHam=String(r[iK]).trim();
      /* BİDON gibi tank olmayan satırlar — sisteme girmez, ayrıca raporlanır */
      if(!/^[A-ZÇĞİÖŞÜ]\s*-?\s*\d+$/i.test(kodHam)){ tankDisi.push(kodHam); return; }
      const kod=kodBul(kodHam)||kodDuzelt(kodHam);
      const t=aktifTankBul(kod);
      const ph=iP>=0?String(r[iP]??'').trim():'';
      const tuz=iT>=0?String(r[iT]??'').trim():'';
      const asit=iA>=0?String(r[iA]??'').trim():'';
      const sic=iS>=0?String(r[iS]??'').trim():'';
      const not_=iN>=0?String(r[iN]??'').trim():'';
      /* Analiz tarihi sütunu varsa onu kullan; yoksa bugünü kabul et */
      const aTarih=(iAT>=0? analizTarihCevir(r[iAT]) : '') || bug;
      if(!ph&&!tuz&&!asit&&!sic&&!not_){ bosSatir.push(kod); return; }
      if(!t){ eslesmeyen.push(kod); return; }
      /* MÜKERRER KONTROLÜ: aynı tank + aynı analiz tarihi zaten kayıtlıysa atla */
      const varMi=(numuneListe(t)||[]).some(m=>m.tarih===aTarih);
      if(varMi){ zatenVar.push(kod+' ('+kisaTarih(aTarih)+')'); return; }
      eslesen.push({t, kod:t.kod, urun:t.urun, aTarih,
        olcum:{tarih:aTarih, ph, tuz, asit, sicaklik:sic, not:not_}});
    });
    const atlananOzet =
        (zatenVar.length?`<p class="hint" style="color:var(--yesil)">✓ ${zatenVar.length} kayıt <b>zaten sistemde</b>, tekrar eklenmeyecek${zatenVar.length<=12?': '+zatenVar.slice(0,12).join(', '):''}</p>`:'')
      + (tankDisi.length?`<p class="hint">${tankDisi.length} satır tank kodu değil (BİDON vb.), atlandı.</p>`:'')
      + (eslesmeyen.length?`<p class="hint" style="color:var(--alarm)">⚠ ${eslesmeyen.length} kod tank listesinde bulunamadı: ${[...new Set(eslesmeyen)].slice(0,10).join(', ')}</p>`:'')
      + (bosSatir.length?`<p class="hint">${bosSatir.length} satırda değer yok, atlandı.</p>`:'');
    if(!eslesen.length){
      q('#an_sonuc').innerHTML='<p class="hint"><b>Eklenecek yeni analiz yok.</b></p>'+atlananOzet;
      return;
    }
    /* Analiz tarihine göre grupla — hangi tarihten kaç yeni kayıt geliyor */
    const tarihGrup={};
    eslesen.forEach(x=>{ tarihGrup[x.aTarih]=(tarihGrup[x.aTarih]||0)+1; });
    q('#an_sonuc').innerHTML=
      '<div class="sec">Eklenecek Yeni Analizler ('+eslesen.length+')</div>'
      + '<p class="hint">'+Object.entries(tarihGrup).sort().map(([t,n])=>`<b>${kisaTarih(t)}</b>: ${n} tank`).join(' · ')+'</p>'
      + eslesen.slice(0,40).map(x=>`<div class="log"><span class="d">${x.kod}</span><span class="v">${kisaTarih(x.aTarih)} · ${x.urun||'—'}
          ${x.olcum.ph?' · pH '+x.olcum.ph:''}${x.olcum.tuz?' · Tuz '+x.olcum.tuz+'%':''}${x.olcum.asit?' · Asit '+x.olcum.asit+'%':''}${x.olcum.sicaklik?' · '+x.olcum.sicaklik+'°':''}</span></div>`).join('')
      + (eslesen.length>40?`<p class="hint">… ve ${eslesen.length-40} kayıt daha</p>`:'')
      + atlananOzet
      + '<button class="btn" id="an_uygula" style="margin-top:10px">'+eslesen.length+' Analiz Kaydı Ekle</button>';
    q('#an_uygula').onclick=async()=>{
      const ok=await onayDialog('Analiz Sonuçlarını Ekle',
        eslesen.length+' analiz kaydı eklenecek.\nHer kayıt kendi analiz tarihiyle işlenir.\nMevcut kayıtlar silinmez.','Ekle');
      if(!ok) return;
      window.__analizOnceki=JSON.parse(JSON.stringify(tanklar));
      let sira=0;
      eslesen.forEach(x=>{
        (x.t.olcumler=x.t.olcumler||[]).unshift(x.olcum);
        /* Excel'den analiz gelmesi = numune alınmış demektir.
           gun: analiz tarihindeki fermantasyon günü (bugün değil) */
        numuneListe(x.t).push({id:'m'+Date.now()+'_'+(sira++)+'_'+x.t.id, tarih:x.aTarih,
          gun: gunTarihte(x.t, x.aTarih),
          kisi:kullaniciAdi()||'—', saat:saatSimdi(),
          ph:x.olcum.ph||'', tuz:x.olcum.tuz||'', asit:x.olcum.asit||'', not:x.olcum.not||''});
      });
      /* Her tankın numune ve ölçüm listesini tarihe göre yeniden sırala (en yeni başta) */
      [...new Set(eslesen.map(x=>x.t))].forEach(t=>{
        if(Array.isArray(t.numune2)) t.numune2.sort((a,b)=>String(b.tarih||'').localeCompare(String(a.tarih||'')));
        if(Array.isArray(t.olcumler)) t.olcumler.sort((a,b)=>String(b.tarih||'').localeCompare(String(a.tarih||'')));
      });
      await tankYaz();
      q('#an_sonuc').innerHTML='<p class="hint" style="color:var(--yesil)">✓ '+eslesen.length+' analiz kaydı eklendi.</p>'
        + '<button class="btn ghost" id="an_geri" style="margin-top:8px">Geri Al</button>';
      q('#an_geri').onclick=async()=>{
        if(!window.__analizOnceki) return;
        tanklar=window.__analizOnceki; await tankYaz(); kapat(); ciz(); toast('Analiz yüklemesi geri alındı');
      };
      toast(eslesen.length+' tanka ölçüm eklendi');
    };
  };
  q('#an_dosya').onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    const ad=f.name.toLocaleLowerCase('tr');
    try{
      if(/\.(xlsx|xlsm|xls|ods)$/.test(ad)){
        toast('Excel okunuyor…');
        if(!window.XLSX){
          await new Promise((res,rej)=>{
            const sc=document.createElement('script');
            sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
            sc.onload=res; sc.onerror=()=>rej(new Error('Excel kütüphanesi indirilemedi'));
            document.head.appendChild(sc);
          });
        }
        const buf=await f.arrayBuffer();
        const wb=XLSX.read(buf,{type:'array',cellDates:true});
        const sh=wb.Sheets[wb.SheetNames[0]];
        const satirlar=XLSX.utils.sheet_to_json(sh,{header:1,raw:true,defval:''});
        isle(satirlar);
      }else{
        const metin=await f.text();
        isle(csvTumSatirlar(metin));
      }
    }catch(err){
      q('#an_sonuc').innerHTML='<p class="hint" style="color:var(--alarm)">Okunamadı: '+err.message+'</p>';
    }
  };
  q('#an_metinOku').onclick=()=>{
    const m=q('#an_metin').value;
    if(!m.trim()){ toast('Alan boş'); return; }
    isle(csvTumSatirlar(m.replace(/\t/g,';')));
  };
}
function excelOnizle(p, satirlar){
  const q=s=>p.querySelector(s);
  const {kayitlar, hata}=satirlariTanka(satirlar);
  if(hata){ q('#ex_sonuc').innerHTML='<p class="hint" style="color:var(--alarm)">'+hata+'</p>'; return; }
  const yeni=[], guncel=[], yenidenDolum=[];
  kayitlar.forEach(k=>{
    const aktif=aktifTankBul(k.kod);
    const bos=tanklar.find(t=>t.kod===k.kod&&t.bosaltildi);
    if(aktif) guncel.push({k, t:aktif});
    else if(bos) yenidenDolum.push({k, t:bos});
    else yeni.push({k});
  });
  q('#ex_sonuc').innerHTML=`
    <div class="sec">Önizleme — ${kayitlar.length} satır</div>
    <div class="dstat">
      <div class="dkart"><span>Yeni tank</span><b>${yeni.length}</b></div>
      <div class="dkart"><span>Dolu (güncellenecek)</span><b>${guncel.length}</b></div>
      <div class="dkart"><span>Boş tanka dolum</span><b>${yenidenDolum.length}</b></div>
    </div>
    ${(()=>{
      const kgSay=v=>{ const s=String(v||'').replace(/[^0-9]/g,''); return s?+s:null; };
      const farkli=[];
      guncel.forEach(x=>{
        const f=[];
        if(x.k.urun && x.k.urun!==x.t.urun) f.push({a:'Ürün', e:x.t.urun||'—', y:x.k.urun});
        if(x.k.kg && kgSay(x.t.kapasite)!==x.k.kg) f.push({a:'Miktar', e:(kgSay(x.t.kapasite)||'—')+' kg', y:x.k.kg+' kg'});
        if(x.k.tarih && x.k.tarih!==x.t.baslangic) f.push({a:'Dolum tarihi', e:kisaTarih(x.t.baslangic), y:kisaTarih(x.k.tarih)});
        if(x.k.hedef && +x.k.hedef!==+x.t.hedefGun) f.push({a:'Hedef gün', e:x.t.hedefGun, y:x.k.hedef});
        if(f.length) farkli.push({t:x.t, f});
      });
      const ayni=guncel.length-farkli.length;
      return `<div class="sec">Mevcut tanklarda değişiklik</div>
      <p class="hint">${ayni} tankta <b>değişiklik yok</b>${farkli.length?`, <b style="color:var(--amber)">${farkli.length} tankta</b> şunlar değişecek:`:'.'}</p>
      ${farkli.slice(0,40).map(x=>`<div class="log"><span class="d">${x.t.kod}</span><span class="v">
        ${x.f.map(o=>`${o.a}: <b>${o.e}</b> → <b style="color:var(--amber)">${o.y}</b>`).join('<br>')}</span></div>`).join('')}
      ${farkli.length>40?`<p class="hint">… ve ${farkli.length-40} tank daha</p>`:''}
      <p class="hint">Ölçümler, kimyasallar ve onay kayıtları her durumda korunur.</p>`;
    })()}
    ${yeni.length?`<div class="sec">Yeni eklenecek</div>
      ${yeni.slice(0,25).map(x=>`<div class="log"><span class="d">${x.k.kod}</span><span class="v">${x.k.urun||'—'}${x.k.kg?' · '+x.k.kg+' kg':''}${x.k.tarih?' · '+x.k.tarih:''}</span></div>`).join('')}
      ${yeni.length>25?`<p class="hint">… ve ${yeni.length-25} tank daha</p>`:''}`:''}
    ${(()=>{
      const urunler=[...new Set(kayitlar.map(k=>k.urun).filter(Boolean))];
      const programsiz=urunler.filter(u=>!program[u]||!Object.keys(program[u]).length);
      const bugun=new Date(bugunISO());
      const eski=kayitlar.filter(k=>{ if(!k.tarih) return false;
        return (bugun-new Date(k.tarih))/86400000 > 90; });
      return (programsiz.length?`<div class="sec">Programı olmayan ürünler</div>
        <p class="hint">Bu ürünler için bakım programı tanımlı değil, tankları İş Emri'nde görev üretmez:<br><b>${programsiz.join(', ')}</b><br>Program sekmesinden ekleyebilirsin.</p>`:'')
        + (eski.length?`<p class="hint">ℹ ${eski.length} tankın dolum tarihi 90 günden eski (en eskisi ${eski.map(k=>k.tarih).sort()[0]}). Bunlar listede "süre geçti" görünecek.</p>`:'');
    })()}
    ${(()=>{
      const sup=kayitlar.filter(k=>k.supheli);
      return sup.length?`<div class="sec">Kontrol edilmeli</div>
        <p class="hint">Bu satırlar ERP'de <b>çıkış hareketi</b> içeriyor; dolum tarihleri alınmadı, sistemdeki tarih korunacak. Kilo bilgisini elle doğrula:</p>
        ${sup.map(k=>`<div class="log"><span class="d">${k.kod}</span><span class="v">${k.urun||'—'} · dosyadaki kalan: <b>${k.kg||'—'} kg</b><span class="n">${k.supheli}</span></span></div>`).join('')}`:'';
    })()}
    <p class="hint">⚠ Dosyada olmayan tanklara <b>dokunulmaz</b>, hiçbir kayıt silinmez.</p>
    <button class="btn" id="ex_uygula">${kayitlar.length} satırı uygula</button>
  `;
  q('#ex_uygula').onclick=async()=>{
    let secim=1, tarihDegistir=false;
    const tarihKorunan=[];
    const tarihCakisan=guncel.filter(x=>x.k.tarih && x.t.baslangic && x.k.tarih!==x.t.baslangic);
    if(guncel.length){
      secim=await secimDialog(guncel.length+' tank dolu',
        'Bu tanklarda hâlâ ürün var. Ne yapayım?',
        [{etiket:'Bilgiyi güncelle, geçmişi koru', tur:'ana'},
         {etiket:'Yeni parti başlat (ölçümler sıfırlanır)'},
         {etiket:'Dolu tankları atla'}]);
      if(secim===-1) return;
    }
    if(secim===0 && tarihCakisan.length){
      const ornek=tarihCakisan.slice(0,8).map(x=>
        '• '+x.t.kod+': '+kisaTarih(x.t.baslangic)+' → '+kisaTarih(x.k.tarih)).join('\n');
      const s2=await secimDialog(tarihCakisan.length+' tankın dolum tarihi farklı',
        'Dosyadaki tarih sistemdekinden farklı. Dolum tarihi gün sayacını belirler:\n\n'+ornek+
        (tarihCakisan.length>8?'\n… ve '+(tarihCakisan.length-8)+' tank daha':'')+
        '\n\nNe yapayım?',
        [{etiket:'Sistemdeki tarihleri KORU (önerilen)', tur:'ana'},
         {etiket:'Dosyadaki tarihlerle değiştir'}]);
      if(s2===-1) return;
      tarihDegistir = (s2===1);
    }
    window.__exOnceki=JSON.parse(JSON.stringify(tanklar));
    let eklendi=0, guncellendi=0, atlandi=0, partiYeni=0;
    const bugun=bugunISO();
    kayitlar.forEach(k=>{
      const veri={kod:k.kod, urun:k.urun||'', kapasite:k.kg?(k.kg+' kg'):'',
        baslangic:k.tarih||bugun,
        hedefGun:k.hedef||hedefGunHesapla(k.urun,(k.kod.match(/^[A-ZÇĞİÖŞÜ]/)||[''])[0]), notlar:''};
      const aktif=aktifTankBul(k.kod);
      if(aktif){
        if(secim===2){ atlandi++; return; }
        if(secim===0){
          if(k.urun){ tankLog(aktif,'urun',aktif.urun,k.urun,'Excel'); aktif.urun=k.urun; }
          if(k.kg){ const y=k.kg+' kg'; tankLog(aktif,'kapasite',aktif.kapasite,y,'Excel'); aktif.kapasite=y; }
          /* dolum tarihi gün sayacını etkiler — yalnız onay verildiyse değişir */
          if(k.tarih && k.tarih!==aktif.baslangic){
            if(tarihDegistir){ tankLog(aktif,'baslangic',aktif.baslangic,k.tarih,'Excel'); aktif.baslangic=k.tarih; }
            else tarihKorunan.push(aktif.kod+': '+kisaTarih(aktif.baslangic)+' korundu (Excel: '+kisaTarih(k.tarih)+')');
          }
          if(k.hedef){ tankLog(aktif,'hedefGun',aktif.hedefGun,k.hedef,'Excel'); aktif.hedefGun=k.hedef; }
          guncellendi++; return;
        }
        dolumYaz(aktif, veri, false); partiYeni++; return;
      }
      const bos=tanklar.find(t=>t.kod===k.kod&&t.bosaltildi);
      if(bos){ dolumYaz(bos, veri, false); eklendi++; return; }
      tanklar.push({id:'t'+Date.now()+'_'+Math.random().toString(36).slice(2,7),...veri,bosaltildi:'',olcumler:[],kimyasallar:[]});
      eklendi++;
    });
    await tankYaz();
    q('#ex_sonuc').innerHTML=`<p class="hint">${[eklendi&&eklendi+' tank eklendi/dolduruldu',guncellendi&&guncellendi+' güncellendi',partiYeni&&partiYeni+' yeni parti',atlandi&&atlandi+' atlandı'].filter(Boolean).join(', ')||'İşlem yok'}</p>
      ${tarihKorunan.length?`<p class="hint" style="color:var(--yesil)">✓ ${tarihKorunan.length} tankın dolum tarihi korundu</p>`:''}
      <button class="btn ghost" id="ex_geri">Geri Al</button><button class="btn" id="ex_bitti">Tamam</button>`;
    ciz();
    q('#ex_geri').onclick=async()=>{ if(window.__exOnceki){ tanklar=window.__exOnceki; await tankYaz(); } kapat(); ciz(); toast('Geri alındı'); };
    q('#ex_bitti').onclick=()=>kapat();
  };
}
function sesliGirisDestek(){
  return !!(window.SpeechRecognition||window.webkitSpeechRecognition);
}
function hizliEkle(){
  const destekli=sesliGirisDestek();
  const p=panel(`
    <div class="pbar"><h2>Hızlı Ekle</h2><button class="icon" data-kapat>Kapat</button></div>
    <p class="hint">Her satıra bir işlem yaz: dolum ("A-002 nolu tanka 11355 kg no2 salatalık dolduruldu"),
    boşaltma ("A-3 boşaltıldı"), devirdaim ("A-5 devirdaim yapıldı") veya ölçüm ("A-2 pH 4.1 tuz 8").</p>
    <div style="display:flex;gap:8px;align-items:flex-start">
      <textarea id="hz_metin" style="min-height:160px;font-family:ui-monospace,monospace;font-size:13.5px;flex:1" placeholder="A-002 nolu tanka 11355 kg no2 salatalık dolduruldu."></textarea>
      ${destekli?'<button class="icon" id="hz_mic" style="flex:0 0 auto;padding:12px 14px">🎤</button>':''}
    </div>
    <button class="btn" id="hz_onizle">Önizle</button>
    <div id="hz_sonuc"></div>
  `);
  const q=s=>p.querySelector(s);
  q('#hz_onizle').onclick=()=>hizliOnizleGoster(p, q('#hz_metin').value);
  if(destekli){
    const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;
    const rec=new Rec();
    rec.lang='tr-TR'; rec.interimResults=false; rec.continuous=false;
    let dinliyor=false;
    q('#hz_mic').onclick=()=>{
      if(dinliyor){ rec.stop(); return; }
      try{ rec.start(); dinliyor=true; q('#hz_mic').style.color='var(--amber)'; }
      catch(e){ toast('Mikrofon başlatılamadı'); }
    };
    rec.onresult=(e)=>{
      const metin=Array.from(e.results).map(r=>r[0].transcript).join(' ');
      const ta=q('#hz_metin');
      ta.value=(ta.value.trim()+'\n'+metin).trim();
    };
    rec.onend=()=>{ dinliyor=false; q('#hz_mic').style.color=''; };
    rec.onerror=()=>{ dinliyor=false; q('#hz_mic').style.color=''; toast('Sesli giriş hatası'); };
  }
}

/* ================= QR kod ================= */
function tabanURL(){
  return location.origin + location.pathname;
}
async function qrOku(){
  const destek = ('BarcodeDetector' in window);
  const p=panel(`
    <div class="pbar"><h2>QR Okut</h2><button class="icon" data-kapat>Kapat</button></div>
    <div id="qrOkuAlan">
      ${destek?`
        <div class="kamKutu"><video id="qrVideo" playsinline muted></video><div class="kamCerceve"></div></div>
        <p class="hint" id="qrDurum">Kamera açılıyor…</p>`
      :`<div class="empty"><b>Bu tarayıcı desteklemiyor</b>Telefonun kamera uygulamasıyla QR'ı okut, otomatik açılır.</div>`}
      <label>Ya da tank kodunu yaz</label>
      <input id="qrElle" placeholder="A-002" autocapitalize="characters">
      <button class="btn" id="qrGit">Tankı Aç</button>
    </div>
  `);
  const q=s=>p.querySelector(s);
  q('#qrGit').onclick=()=>{
    const kod=kodDuzelt(q('#qrElle').value||'');
    if(!kod){ toast('Tank kodu yaz'); return; }
    dur(); kapat(); cizTankIsEmri(kod);
  };
  let akis=null, calisiyor=false, zaman=null;
  function dur(){
    calisiyor=false;
    if(zaman) clearInterval(zaman);
    if(akis) akis.getTracks().forEach(t=>t.stop());
    akis=null;
  }
  p.querySelectorAll('[data-kapat]').forEach(b=>b.addEventListener('click',dur));
  if(!destek) return;
  try{
    akis=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
    const v=q('#qrVideo');
    v.srcObject=akis; await v.play();
    q('#qrDurum').textContent='QR kodu çerçeveye tut';
    calisiyor=true;
    const dedektor=new BarcodeDetector({formats:['qr_code']});
    zaman=setInterval(async()=>{
      if(!calisiyor||!document.getElementById('panel')) { dur(); return; }
      try{
        const bulunan=await dedektor.detect(v);
        if(bulunan&&bulunan.length){
          const ham=bulunan[0].rawValue||'';
          let kod=null;
          const m=ham.match(/[?&]tank=([^&]+)/i);
          if(m) kod=kodDuzelt(decodeURIComponent(m[1]));
          else if(/^[A-ZÇĞİÖŞÜ]{1,3}-?\d{1,5}$/i.test(ham.trim())) kod=kodDuzelt(ham.trim());
          if(kod){
            if(navigator.vibrate) navigator.vibrate(60);
            dur(); kapat(); cizTankIsEmri(kod);
          }
        }
      }catch(e){}
    },350);
  }catch(e){
    q('#qrDurum').textContent='Kameraya erişilemedi. İzin verdiğinden emin ol ya da kodu elle yaz.';
  }
}

function qrOlustur(){
  const aktifTanklar=tanklar.filter(t=>!t.bosaltildi).sort((a,b)=>a.kod.localeCompare(b.kod,'tr',{numeric:true}));
  const basilmamis=aktifTanklar.filter(t=>!t.qrBasildi);
  const p=panel(`
    <div class="pbar"><h2>QR Kodları</h2><button class="icon" data-kapat>Kapat</button></div>
    <p class="hint">Tank başına bir QR üretilir. Yapıştırdıktan sonra QR'ı okutan kişi doğrudan o tankın bugünkü işini görür ve onaylar.</p>
    ${basilmamis.length?`<button class="btn ghost" id="qHepsiBasildi" style="margin-bottom:10px">✓ Mevcut ${basilmamis.length} tankın QR'ı zaten basılı</button>
    <p class="hint" style="margin-top:-4px">Etiketleri daha önce bastıysan buna dokun — bundan sonra sadece <b>yeni eklenen</b> tanklar listelenir.</p>`:''}
    <details style="margin-bottom:10px">
      <summary style="cursor:pointer;color:var(--muted);font-size:12.5px">Elle işaretle (kod yapıştır)</summary>
      <textarea id="qYapistir" rows="3" placeholder="A-002 A-003 A-004 ..." style="margin-top:8px"></textarea>
      <button class="btn ghost" id="qYapistirUygula" style="margin-top:6px">Bu kodları "basıldı" işaretle</button>
    </details>
    <div class="seg" style="flex-wrap:wrap">
      <button id="qm0" aria-pressed="true">🆕 Basılmamışlar (${basilmamis.length})</button>
      <button id="qm1" aria-pressed="false">Aralık seç</button>
      <button id="qm3" aria-pressed="false">📋 Kod listesi</button>
      <button id="qm2" aria-pressed="false">Tümü (${aktifTanklar.length})</button>
    </div>
    <div id="qListe" style="display:none">
      <p class="hint">Basmak istediğin tank kodlarını yapıştır:</p>
      <textarea id="qListeMetin" rows="3" placeholder="A-009 A-057 A-059 D-097 ..."></textarea>
    </div>
    <div id="qYeni">
      ${basilmamis.length
        ? `<p class="hint">Bu tanklara henüz QR basılmadı:<br><b>${basilmamis.slice(0,40).map(t=>t.kod).join(', ')}${basilmamis.length>40?' … +'+(basilmamis.length-40):''}</b></p>`
        : `<p class="hint">Tüm aktif tankların QR'ı basılmış görünüyor. Yeni tank eklendiğinde burada listelenir.</p>`}
    </div>
    <div id="qAralik">
      <div class="two">
        <div><label>Seri</label><input id="q_seri" placeholder="A" autocapitalize="characters"></div>
        <div><label>İlk no</label><input type="number" id="q_bas" value="1"></div>
        <div><label>Son no</label><input type="number" id="q_son" value="20"></div>
      </div>
    </div>
    <label>Etiket boyutu</label>
    <div class="seg">
      <button id="qb2" aria-pressed="false">Büyük<br><small>8/sayfa</small></button>
      <button id="qb3" aria-pressed="false">Orta<br><small>15/sayfa</small></button>
      <button id="qb32" aria-pressed="true">A4 Tam<br><small>32/sayfa</small></button>
      <button id="qb4" aria-pressed="false">Küçük<br><small>40/sayfa</small></button>
    </div>
    <button class="btn" id="q_uret">QR'ları Oluştur</button>
    <div id="qSonuc"></div>
  `);
  const q=s=>p.querySelector(s);
  let mod='yeni', yzBoy='yz32';
  const modAyar=(m)=>{
    mod=m;
    q('#qm0').setAttribute('aria-pressed', m==='yeni');
    q('#qm1').setAttribute('aria-pressed', m==='aralik');
    q('#qm2').setAttribute('aria-pressed', m==='tumu');
    q('#qYeni').style.display   = m==='yeni'   ? '' : 'none';
    q('#qAralik').style.display = m==='aralik' ? '' : 'none';
    q('#qListe').style.display  = m==='liste'  ? '' : 'none';
    q('#qm3').setAttribute('aria-pressed', m==='liste');
  };
  ['2','3','32','4'].forEach(n=>{
    q('#qb'+n).onclick=()=>{
      yzBoy='yz'+n;
      ['2','3','32','4'].forEach(m=>q('#qb'+m).setAttribute('aria-pressed', m===n));
      const alan=q('#qrYazdirAlani');
      if(alan) alan.className=yzBoy;
    };
  });
  const qhb=q('#qHepsiBasildi');
  if(qhb) qhb.onclick=async()=>{
    const ok=await onayDialog('Hepsi Basılı Say',
      basilmamis.length+' tankın QR etiketi basılmış sayılacak.\n\n'+
      'Bundan sonra bu ekranda sadece YENİ eklenen tanklar görünür.','Evet, basılı');
    if(!ok) return;
    const bug=bugunISO();
    basilmamis.forEach(t=>{ const tt=tanklar.find(x=>x.id===t.id); if(tt) tt.qrBasildi=bug; });
    await tankYaz();
    toast(basilmamis.length+' tank basılı işaretlendi');
    kapat(); qrOlustur();
  };
  q('#qYapistirUygula').onclick=async()=>{
    const ham=q('#qYapistir').value.trim();
    if(!ham){ toast('Kod listesi boş'); return; }
    const kodlar=[...new Set(ham.split(/[\s,;\n\r\t]+/).map(s=>s.trim()).filter(Boolean))];
    const bug=bugunISO(); let bulundu=0; const yok=[];
    const harita=new Map();
    tanklar.forEach(t=>{ if(t.kod) harita.set(kodNormal(t.kod), t); });
    kodlar.forEach(k=>{
      const t=harita.get(kodNormal(k));
      if(t){ t.qrBasildi=bug; bulundu++; } else yok.push(k);
    });
    await tankYaz();
    if(yok.length){
      await onayDialog('Sonuç',
        bulundu+' tank işaretlendi.\n\nBulunamayan '+yok.length+' kod:\n'+yok.join(', '),'Tamam');
    } else toast(bulundu+' tank işaretlendi');
    kapat(); qrOlustur();
  };
  q('#qm0').onclick=()=>modAyar('yeni');
  q('#qm1').onclick=()=>modAyar('aralik');
  q('#qm3').onclick=()=>modAyar('liste');
  q('#qm2').onclick=()=>modAyar('tumu');
  modAyar('yeni');
  q('#q_uret').onclick=async()=>{
    let liste;
    if(mod==='yeni'){
      liste=aktifTanklar.filter(t=>!t.qrBasildi);
      if(!liste.length){ toast('Basılmamış tank yok'); return; }
    }
    else if(mod==='liste'){
      const ham=q('#qListeMetin').value.trim();
      if(!ham){ toast('Kod listesi boş'); return; }
      const istenen=[...new Set(ham.split(/[\s,;\n\r\t]+/).map(s=>s.trim()).filter(Boolean))];
      const harita=new Map();
      aktifTanklar.forEach(t=>{ if(t.kod) harita.set(kodNormal(t.kod), t); });
      const bulunan=[], yok=[];
      istenen.forEach(k=>{ const t=harita.get(kodNormal(k)); if(t) bulunan.push(t); else yok.push(k); });
      if(!bulunan.length){ await onayDialog('Eşleşme Yok','Yazdığın kodların hiçbiri bulunamadı:\n'+istenen.join(', '),'Tamam'); return; }
      if(yok.length) await onayDialog('Bazı Kodlar Bulunamadı',
        bulunan.length+' tank bulundu.\n\nBulunamayan '+yok.length+' kod:\n'+yok.join(', ')+'\n\nBulunanlarla devam edilecek.','Devam');
      liste=bulunan;
    }
    else if(mod==='tumu'){ liste=aktifTanklar; }
    else{
      const sr=q('#q_seri').value.trim().toUpperCase();
      const b=+q('#q_bas').value, s=+q('#q_son').value;
      if(!sr||!(s>=b)){ toast('Seri ve numaraları kontrol et'); return; }
      liste=[];
      for(let i=b;i<=s;i++){ liste.push({kod:sr+'-'+i}); }
    }
    if(!liste.length){ toast('Liste boş'); return; }
    q('#qSonuc').innerHTML=`
      <p class="hint">${liste.length} adet QR. Aşağıdan yazdırabilirsin.</p>
      <button class="btn" id="q_yazdir">Yazdır</button>
      <div id="qrYazdirAlani" class="${yzBoy}">${liste.map(t=>`
        <div class="qrKart"><div class="qrKutu" id="qr_${t.kod.replace(/[^A-Z0-9]/g,'_')}"></div><div class="qrEtiket">${t.kod}</div></div>
      `).join('')}</div>
    `;
    liste.forEach(t=>{
      const el=q('#qr_'+t.kod.replace(/[^A-Z0-9]/g,'_'));
      if(el && window.QRCode){
        new QRCode(el,{text:tabanURL()+'?tank='+encodeURIComponent(t.kod), width:110, height:110});
      }
    });
    q('#q_yazdir').onclick=async()=>{
      qrYazdir(liste, yzBoy);
      // gercek tank kayitlarini "basildi" isaretle
      const bug=bugunISO(); let n=0;
      liste.forEach(x=>{
        const t=tanklar.find(tk=>tk.kod===x.kod);
        if(t && !t.qrBasildi){ t.qrBasildi=bug; n++; }
      });
      if(n){ await tankYaz(); }
    };
    if(mod!=='aralik'){
      q('#qSonuc').insertAdjacentHTML('beforeend',
        '<button class="btn ghost" id="q_sifirla">Bu listeyi "basılmadı" yap</button>');
      q('#q_sifirla').onclick=async()=>{
        liste.forEach(x=>{ const t=tanklar.find(tk=>tk.kod===x.kod); if(t) t.qrBasildi=''; });
        await tankYaz(); toast('Basılmadı olarak işaretlendi'); kapat(); qrOlustur();
      };
    }
  };
}
function qrYazdir(liste, yzBoy){
  toast('Yazdırma hazırlanıyor…');
  const sutun = yzBoy==='yz2'?2 : yzBoy==='yz32'?4 : yzBoy==='yz4'?5 : 3;
  const qrMM  = yzBoy==='yz2'?42 : yzBoy==='yz32'?26 : yzBoy==='yz4'?22 : 29;
  const etkPt = yzBoy==='yz2'?20 : yzBoy==='yz32'?13 : yzBoy==='yz4'?10 : 14;
  // Her QR'ı gizli bir kutuda üretip dataURL'e çevir
  const gecici=document.createElement('div');
  gecici.style.cssText='position:absolute;left:-9999px;top:0';
  document.body.appendChild(gecici);
  const kartlar=[];
  liste.forEach(t=>{
    const kutu=document.createElement('div');
    gecici.appendChild(kutu);
    new QRCode(kutu,{text:tabanURL()+'?tank='+encodeURIComponent(t.kod), width:300, height:300, correctLevel:QRCode.CorrectLevel.M});
    kartlar.push({kod:t.kod, el:kutu});
  });
  // canvas/img hazır olsun diye kısa bekleme
  setTimeout(()=>{
    let icerik='';
    kartlar.forEach(k=>{
      const cv=k.el.querySelector('canvas');
      const im=k.el.querySelector('img');
      let src='';
      try{ src = cv ? cv.toDataURL('image/png') : (im?im.src:''); }catch(e){ src = im?im.src:''; }
      icerik += `<div class="k"><img src="${src}"><div class="e">${k.kod}</div></div>`;
    });
    gecici.remove();
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>QR Etiketleri</title>
    <style>
      @page{size:A4;margin:8mm}
      *{box-sizing:border-box;margin:0;padding:0}
      body{font-family:Arial,sans-serif}
      .grid{display:grid;grid-template-columns:repeat(${sutun},1fr);gap:5mm}
      .k{border:1px solid #999;border-radius:3mm;padding:3mm;text-align:center;break-inside:avoid;page-break-inside:avoid}
      .k img{width:${qrMM}mm;height:${qrMM}mm;display:block;margin:0 auto 2mm}
      .e{font-weight:700;font-size:${etkPt}pt}
    </style></head><body>
      <div class="grid">${icerik}</div>
      <script>window.onload=function(){setTimeout(function(){window.print();},300);};<\/script>
    </body></html>`;
    const w=window.open('','_blank');
    if(!w){ toast('Açılır pencere engellendi. Tarayıcı ayarından izin ver.'); return; }
    w.document.open(); w.document.write(html); w.document.close();
  }, 400);
}

/* ================= QR ile açılan tank ekranı ================= */
function qrCik(){
  qrGoruntuKod=null;
  const nv=document.querySelector('nav'); if(nv) nv.style.display='';
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
  gorunum='tanklar'; ciz();
}
function cizTankIsEmri(kod){
  qrGoruntuKod=kod;
  document.querySelector('nav').style.display='none';
  document.getElementById('fab').style.display='none';
  const t=tanklar.find(x=>x.kod===kod && !x.bosaltildi) || tanklar.find(x=>x.kod===kod);
  document.getElementById('hdr').innerHTML=`
    <div class="top"><button class="icon" id="qrGeri">‹ Geri</button><h1 style="flex:1;text-align:center">${kod}</h1><button class="icon" id="qrAna">Ana Sayfa</button></div>`;
  const gb=document.getElementById('qrGeri'); if(gb) gb.onclick=qrCik;
  const ab=document.getElementById('qrAna'); if(ab) ab.onclick=()=>{ qrGoruntuKod=null; const nv=document.querySelector('nav'); if(nv) nv.style.display=''; try{ history.replaceState(null,'',location.pathname); }catch(e){} gorunum='isemri'; ciz(); };
  const e=document.getElementById('ekran');
  if(!t){
    e.innerHTML=`<div class="empty"><b>Tank bulunamadı</b>Bu kod aktif tanklarda yok ya da boşaltılmış olabilir.</div>`;
    return;
  }
  const g=gun(t), d=durum(t);
  const up=program[programUrun(t.urun)]||{};
  const bugun=bugunISO();
  const bugunProg=up[g];
  const done=isemri[bugun]||{};
  if(t.bosaltildi){
    e.innerHTML=`
      <div class="card" style="align-items:flex-start">
        <div class="info">
          <div class="row1"><span class="kod">${t.kod}</span><span class="kap">${t.kapasite||''}</span></div>
          <div class="urun">${t.urun||'—'}</div>
          <div class="meta"><span class="pill">Boşaltıldı · ${kisaTarih(t.bosaltildi)}</span>
          ${t.bosaltan?`<span class="pill">${t.bosaltan}</span>`:''}</div>
        </div>
      </div>
      ${t.temizlendi
        ?`<div class="empty"><b>✓ Tank temiz</b>${kisaTarih(t.temizlendi)}${t.temizleyen?' · '+t.temizleyen:''} — yeni dolum için hazır.</div>`
        :`<div class="empty" style="border-color:var(--amber)"><b>Dip · Temizlenecek</b>${g} gün fermente edildi, ${kisaTarih(t.bosaltildi)}'de boşaltıldı.</div>
          <button class="btn" id="qrTemiz">Temizlik Yapıldı</button>`}`;
      const tb2=e.querySelector('#qrTemiz');
      if(tb2) tb2.onclick=async()=>{
        if(!onayYetkisi()) return;
        const ok=await onayDialog(t.kod+' — Temizlik',
          'Tank dibi temizlendi mi? Temiz listesine geçecek.','Temizlendi');
        if(!ok) return;
        t.temizlendi=bugunISO(); t.temizleyen=kullaniciAdi(); t.temizlikSaat=saatSimdi();
        await tankYaz(); cizTankIsEmri(kod); toast(t.kod+' temiz');
      };
    return;
  }
  e.innerHTML=`
    <div class="card" style="align-items:flex-start">
      <div class="info">
        <div class="row1"><span class="kod">${t.kod}</span><span class="kap">${t.kapasite||''}</span></div>
        <div class="urun">${t.urun||'—'}</div>
        <div class="meta">
          <span class="pill ${SINIF[d]}">${ETIKET[d]}</span>
          <span class="pill">${g}/${t.hedefGun} gün</span>
          ${(notYetkisi()&&notSayi(t))?`<span class="pill notPill">📝 ${notSayi(t)}</span>`:''}
          <span class="pill">Dolum ${kisaTarih(t.baslangic)}</span>
          ${t.devSure?`<span class="pill soon">Devirdaim özel: ${t.devSure} sa</span>`:''}
        </div>
        ${(()=>{const sb=tankBakimGecmisi(t,1)[0];return sb?`<p class="hint" style="margin:7px 0 0">Son bakım: ${sb.gorev} · ${kisaTarih(sb.tarih)}${sb.kisi?' · '+sb.kisi:''}</p>`:'';})()}
      </div>
    </div>
    <div class="gunBuyuk ${d==='hazir'?'gb-ok':(d==='bugunKapanacak'?'gb-hazir':(d==='gecti'?'gb-gecti':''))}">
      <span class="gbSayi">${g}</span>
      <span class="gbYazi">. GÜN<small>hedef ${t.hedefGun} gün</small></span>
    </div>
    ${(!bugunProg||!bugunProg.g.length)?`<div class="empty"><b>Bugün görev yok</b>Bu tank için bugüne tanımlı bir iş bulunmuyor.</div>`:`
    <div class="grup">
      <h3>Bugünün İşi<small>${g}. gün</small></h3>
      ${(()=>{
        const devK=bugunProg.g.filter(k=>k==='D'||k==='D2'||k==='DV');
        const tuzK=bugunProg.g.filter(k=>k==='T');
        const digerK=bugunProg.g.filter(k=>k!=='T'&&k!=='D'&&k!=='D2'&&k!=='DV');
        let html='';
        // Devirdaim — ayrı
        devK.forEach(k=>{
          const key=t.id+':'+k, ok=!!done[key];
          html+=`<button class="gorev qrgorev ${ok?'ok':''}" data-key="${key}">

              ${tuzKg?`<span class="kgrozet">${tuzKg} kg</span>`:''}
              ${ok&&done[key]&&done[key].k?`<span class="n">✓ ${done[key].k} · ${done[key].s||''}</span>`:`<span class="n">Dokun ve onayla</span>`}</span>
          </button>`;

        // Diğer işler — tek paket
        if(digerK.length){
          const keys=digerK.map(k=>t.id+':'+k);

          const ilkDone=done[keys[0]];

          html+=`<button class="gorev qrgorev ${hepsiOk?'ok':''}" data-keys="${keys.join(',')}">

              ${digerK.length>1?`<span class="kgrozet" style="background:linear-gradient(135deg,var(--mavi),var(--mavi2))">${digerK.length} iş birlikte</span>`:''}

    ${(t.olcumler||[]).length?`

    </div>
    ${acikMi(t)
      ? `<div class="acikKart"><b>🔓 AÇIK TANK</b><span>${kisaTarih(t.acik.tarih)}'den beri · ${t.acik.kisi||'—'}${t.acik.kalan!=null?` · kalan ${t.acik.kalan} kg`:''}</span></div>
         <button class="btn ghost" id="qrAcikGun">Kalan Miktarı Güncelle</button>`
      : `<button class="btn ghost" id="qrTankAc">🔓 Ürün Çektim (yarım kaldı)</button>`}
    <button class="btn danger" id="qrBosalt">Tankı Boşalt</button>
    <p class="hint">Boşaltma kaydı adınla ve saatle kaydedilir.</p>
  `;
  const qta=e.querySelector('#qrTankAc');
  if(qta) qta.onclick=async()=>{ await tankAc(t.id); if(qrGoruntuKod) cizTankIsEmri(kod); };
  const qag=e.querySelector('#qrAcikGun');
  if(qag) qag.onclick=async()=>{ await acikGuncelle(t.id); if(qrGoruntuKod) cizTankIsEmri(kod); };
  const bosaltBtn=e.querySelector('#qrBosalt');
  if(bosaltBtn) bosaltBtn.onclick=async()=>{
    if(!onayYetkisi()) return;
    const onay=await onayDialog(t.kod+' — Tankı Boşalt',
      t.urun+' · '+g+'. gün\nBu tank boşaltıldı mı? İşlem kaydedilecek.', 'Boşalt');
    if(!onay) return;
    t.bosaltildi=bugunISO();
    t.bosaltan=kullaniciAdi();
    t.bosaltmaSaat=saatSimdi();
    await tankYaz();
    cizTankIsEmri(kod);
    toast(t.kod+' boşaltıldı');
  };
  e.onclick=async ev=>{
    const kd=ev.target.closest('.kimDuzelt');
    if(kd){
      if(!onayYetkisi()) return;
      const i=+kd.dataset.i, kay=(t.kimyasallar||[])[i];
      if(!kay) return;
      const ym=await girdiDialog(kay.ad+' — Düzelt','Miktarı değiştir; silmek için kutuyu boşalt ve Kaydet.', kay.miktar||'');
      if(ym===null) return;
      if(ym===''){ t.kimyasallar.splice(i,1); toast('Kayıt silindi'); }
      else { kay.miktar=ym; kay.k=kullaniciAdi(); kay.s=saatSimdi(); toast('Güncellendi'); }
      await tankYaz(); cizTankIsEmri(kod); return;
    }
    if(ev.target.closest('#qrNotEkle')){
      if(!notYetkisi()){ toast('Bu cihazın not yetkisi yok'); return; }
      const r=await notDialog(t.kod+' — Yeni Not','');
      if(r===null||(!r.metin&&!r.fotoId)) return;
      notListe(t).unshift({id:'n'+Date.now(), m:r.metin, foto:r.fotoId||null, k:kullaniciAdi()||'—', t:bugunISO(), s:saatSimdi()});
      await tankYaz(); cizTankIsEmri(kod); toast('Not eklendi'); return;
    }
    const nf=ev.target.closest('[data-notfoto]');
    if(nf){ fotoGoster(nf.dataset.notfoto); return; }
    const qnd=ev.target.closest('[data-qnotduz]');
    if(qnd){
      if(!notYetkisi()){ toast('Bu cihazın not yetkisi yok'); return; }
      const n=notListe(t).find(x=>x.id===qnd.dataset.qnotduz); if(!n) return;
      const eskiFoto=n.foto;
      const r=await notDialog(t.kod+' — Notu Düzenle', n.m, n.foto);
      if(r===null) return;
      if(!r.metin&&!r.fotoId){ toast('Not boş bırakılamaz'); return; }
      n.m=r.metin; n.foto=r.fotoId||null;
      n.duz={k:kullaniciAdi()||'—', t:bugunISO(), s:saatSimdi()};
      await tankYaz(); cizTankIsEmri(kod); toast('Not güncellendi');
      if(r.fotoDegisti && eskiFoto && eskiFoto!==r.fotoId) fotoSil(eskiFoto);
      return;
    }
    const qns=ev.target.closest('[data-qnotsil]');
    if(qns){
      if(!notYetkisi()){ toast('Bu cihazın not yetkisi yok'); return; }
      const nid=qns.dataset.qnotsil;
      const n=notListe(t).find(x=>x.id===nid); if(!n) return;
      const ok=await onayDialog('Notu Sil','"'+n.m.slice(0,80)+(n.m.length>80?'…':'')+'"\n\nBu not silinecek.','Sil');
      if(!ok) return;
      t.notlar2=notListe(t).filter(x=>x.id!==nid);
      await tankYaz(); cizTankIsEmri(kod); toast('Not silindi'); return;
    }
    const kb=ev.target.closest('.kimBtn');
    if(kb){
      if(!onayYetkisi()) return;
      let ad=kb.dataset.kim;
      if(ad==='__diger__'){
        ad=await girdiDialog('Kimyasal adı','Program dışı eklediğin maddeyi yaz.','Örn: Kalsiyum klorür');
        if(!ad) return;
      }
      const miktar=await girdiDialog(ad+' — miktar', t.kod+' tankına eklenen miktarı yaz (kg veya litre).', 'Örn: 5 kg');
      if(miktar===null) return;
      (t.kimyasallar=t.kimyasallar||[]).unshift({
        ad, miktar, tarih:bugunISO(), k:kullaniciAdi(), s:saatSimdi()
      });
      await tankYaz();
      cizTankIsEmri(kod);
      toast(ad+' kaydedildi');
      return;
    }
    const b=ev.target.closest('.gorev'); if(!b) return;
    if(!onayYetkisi()) return;
    const d2=isemri[bugun]=isemri[bugun]||{};
    const keys=b.dataset.keys? b.dataset.keys.split(',') : [b.dataset.key];
    const yapildiMi=keys.every(key=>!!d2[key]);
    const baslik=b.querySelector('.gd b')?.textContent||'';
    const coklu=keys.length>1;
    const onay=yapildiMi
      ? await onayDialog(baslik, coklu?'Bu işlerin (hepsinin) onayını geri almak istiyor musun?':'Bu görevin onayını geri almak istiyor musun?', 'Geri Al')
      : await onayDialog(baslik, coklu?'Bu işlerin hepsi yapıldı mı? Tek onayla '+keys.length+' iş işaretlenecek.':'Bu görev yapıldı mı?', 'Onayla');
    if(!onay) return;
    if(yapildiMi){ keys.forEach(key=>delete d2[key]); }
    else{
      const ad=kullaniciAdi(), sa=saatSimdi();
      keys.forEach(key=>{ d2[key]={k:ad, s:sa}; });
    }
    await isemriYaz();
    cizTankIsEmri(kod);
    toast('Kaydedildi');
  };
}

async function gercekVeriYukle(){
  const onay = await onayDialog(
    'Gerçek tank verisi',
    BASLANGIC_TANKLAR.length + ' tank yüklenecek. Mevcut tanklarla aynı kodda olanlar güncellenir, yeni olanlar eklenir. Devam?',
    'Yükle'
  );
  if(!onay) return;
  let yeni=0, guncel=0;
  BASLANGIC_TANKLAR.forEach(v=>{
    const mevcut = tanklar.find(t=>t.kod===v.kod && !t.bosaltildi);
    if(mevcut){ Object.assign(mevcut, {urun:v.urun,kapasite:v.kapasite,baslangic:v.baslangic,hedefGun:v.hedefGun}); guncel++; }
    else{ tanklar.push({...v, id:v.id+'_'+Math.random().toString(36).slice(2,6)}); yeni++; }
  });
  veriYuklendi=true;
  await sSet(K_TANK, tanklar);
  await sSet(K_VERI, true);
  ciz();
  toast(yeni+' yeni, '+guncel+' güncellendi');
}

/* ================= yedek ================= */
function csv(){
  const b=['Tank;Kapasite;Urun;Dolum;Gun;HedefGun;Durum;SonPH;SonTuz;Not'];
  tanklar.forEach(t=>{
    const s=(t.olcumler||[])[0]||{};
    const notMetni=notListe(t).map(n=>n.m).join(' // ').replace(/;/g,',').replace(/[\r\n]+/g,' ');
    b.push([t.kod,t.kapasite||'',t.urun||'',t.baslangic,gun(t),t.hedefGun,ETIKET[durum(t)],s.ph||'',s.tuz||'',notMetni].join(';'));
  });
  return b.join('\n');
}
function indir(ad,icerik,tip){
  try{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([icerik],{type:tip}));
    a.download=ad; a.click(); URL.revokeObjectURL(a.href);
  }catch(e){ toast('İndirilemedi'); }
}
function yedek(){
  const p=panel(`
    <div class="pbar"><h2>Yedek</h2><button class="icon" data-kapat>Kapat</button></div>
    <p class="hint">${tanklar.length} tank kayıtlı. Yedek dosyası tankları + programı içerir.</p>
    <button class="btn ghost" id="y_json">Yedek dosyası indir (.json)</button>
    <button class="btn ghost" id="y_csv">Excel için indir (.csv)</button>
    <div class="sec">Geri yükle</div>
    <label>Yedek metnini yapıştır</label>
    <textarea id="y_metin"></textarea>
    <button class="btn" id="y_yukle">Geri yükle (üzerine yazar)</button>
  `);
  const q=s=>p.querySelector(s);
  q('#y_json').onclick=()=>indir('tank-takip-'+bugunISO()+'.json',JSON.stringify({tanklar,program}),'application/json');
  q('#y_csv').onclick=()=>indir('tank-takip-'+bugunISO()+'.csv','\ufeff'+csv(),'text/csv');
  q('#y_yukle').onclick=async()=>{
    try{
      const v=JSON.parse(q('#y_metin').value);
      if(Array.isArray(v)){ tanklar=v; }
      else{ tanklar=v.tanklar||[]; if(v.program) program=v.program; }
      await tankYaz(); await progKaydet();
      kapat(); ciz(); toast('Yedek yüklendi');
    }catch(e){ toast('Metin okunamadı'); }
  };
}

/* ================= başlat ================= */
(async()=>{
  /* tek seferlik geçiş: v3 boşsa eski anahtardaki veriyi taşı */
  try{
    const yeniD=await fbGetDurum(K_TANK);
    if(yeniD.ok && (yeniD.data===undefined || yeniD.data===null || (Array.isArray(yeniD.data)&&!yeniD.data.length))){
      const eskiD=await fbGetDurum(K_TANK_ESKI);
      if(eskiD.ok && Array.isArray(eskiD.data) && eskiD.data.length){
        await fbSet(K_TANK, eskiD.data);
        const eskiIs=await fbGet(K_IS_ESKI);
        if(eskiIs && typeof eskiIs==='object') await fbSet(K_IS, eskiIs);
        toast(eskiD.data.length+' tank yeni güvenli alana taşındı');
      }
    }
  }catch(e){}
  const tankDurum=await fbGetDurum(K_TANK);
  tankKaynak='bulut';
  if(tankDurum.ok && tankDurum.data!==undefined){
    tanklar=tankDurum.data;
    try{ localStorage.setItem(K_TANK,JSON.stringify(tanklar)); }catch(e){}
  }else{
    tankKaynak = tankDurum.ok ? 'bos' : 'yerel';
    try{ const s=localStorage.getItem(K_TANK); tanklar=s?JSON.parse(s):[]; }catch(e){ tanklar=[]; }
    if(tankKaynak==='yerel') toast('⚠ Buluta ulaşılamadı — bu telefondaki kopya gösteriliyor');
  }
  const progDurum=await fbGetDurum(K_PROG);
  if(progDurum.ok && progDurum.data!==undefined){
    program=programNormalize(nesneCoz(progDurum.data));
    try{ localStorage.setItem(K_PROG,JSON.stringify(program)); }catch(e){}
  }else{
    // Firebase'e ulaşılamadı ya da veri yok → yerel kopyayı kullan, ÜZERİNE YAZMA
    program=programNormalize(await sGet(K_PROG,null));
  }
  if(!Object.keys(program).length){
    program=varsayilanProgram();
    // varsayılanı yalnızca Firebase gerçekten boşsa yaz (bağlantı hatasında yazma!)
    if(progDurum.ok) await progKaydet();
  }
  const [_is,_veri,_dev,_pers,_hedef,_esles,_numAyar] = await Promise.all([
    sGet(K_IS,{}), sGet(K_VERI,false), sGet(K_DEV,{...DEV_VARSAYILAN}),
    sGet(K_PERSONEL,[]), sGet(K_HEDEF,{}), sGet(K_URUNES,{}), sGet(K_NUMUNE_AYAR,null)
  ]);
  isemri=_is;
  if(_numAyar && typeof _numAyar==='object') numuneAyar=_numAyar;
  veriYuklendi=!!_veri;
  devirdaimSure=_dev;
  personel=_pers;
  urunHedef=nesneCoz(_hedef)||{};
  urunEslesme=eslesmeCoz(_esles);
  /* Kavanozluk No.2 varsayılan olarak Salatalık No.2 programına bağlı */
  if(!urunEslesme['Kavanozluk No.2'] && program['Salatalık No.2']){
    urunEslesme['Kavanozluk No.2']='Salatalık No.2';
  }
  if(!urunEslesme['Kelek (Kavanozluk)'] && program['Kelek']){
    urunEslesme['Kelek (Kavanozluk)']='Kelek';
  }
  /* tank kodlarını tek biçime getir: A-11 -> A-011
     ÖNEMLİ: yalnız bulut verisi üstünde çalış — çevrimdışı kopyayı buluta geri yazma */
  {
    let n=0;
    tanklar.forEach(t=>{ if(t.kod){ const y=kodDuzelt(t.kod); if(y!==t.kod){ t.kod=y; n++; } } });
    if(n){
      if(tankKaynak==='bulut'){ await tankYaz(); toast(n+' tank kodu düzeltildi'); }
      else { try{ localStorage.setItem(K_TANK,JSON.stringify(tanklar)); }catch(e){} }
    }
  }
  /* eski sürümden kalan hatalı ad varsa temizle */
  if(urunEslesme['Kavanozluk Kelek']){
    delete urunEslesme['Kavanozluk Kelek'];
    tanklar.forEach(t=>{ if(t.urun==='Kavanozluk Kelek') t.urun='Kelek (Kavanozluk)'; });
  }
  /* eski sürümden gelen ürün adlarını eşle */
  const esle={'Salatalık No.1':'Salatalık No.1'};
  tanklar.forEach(t=>{ if(t.urun&&!program[programUrun(t.urun)]){ const k=Object.keys(program).find(u=>u.toLocaleLowerCase('tr')===t.urun.toLocaleLowerCase('tr')); if(k) t.urun=k; } });
  // hedefi ürün bazında düşürülmüş ama eski kayıtta kırmızı görünen tankları düzelt
  let duzeltme=false;
  tanklar.forEach(t=>{
    if(t.bosaltildi||t.hedefDusuk) return;
    const hg=hedefGunHesapla(t.urun,seri(t));
    if(hg && +t.hedefGun===+hg && gun(t)>=+hg){ t.hedefDusuk=true; duzeltme=true; }
  });
  if(duzeltme) await tankYaz();
  const qsTank=new URLSearchParams(location.search).get('tank');
  if(qsTank){ cizTankIsEmri(kodDuzelt(qsTank)); }
  else{ ciz(); }
  try{ const r0=await fbGet(K_REV); if(r0!==undefined) sonRev=r0; }catch(e){}
  surumKontrol();
  /* geçiş dönemi: eski alandaki kayıtları topla */
  (async()=>{
    const r=await eskiAlandanTopla();
    const p=[];
    if(r.onay)  p.push(r.onay+' onay');
    if(r.not)   p.push(r.not+' not');
    if(r.olcum) p.push(r.olcum+' ölçüm');
    if(r.tank)  p.push(r.tank+' tank');
    if(p.length){
      if(r.tank||r.not||r.olcum) await tankYaz();
      if(r.onay) await isemriYaz();
      ciz(); toast(p.join(' · ')+' eski alandan alındı');
    }
  })();
  gunlukYedekAl();
  canliSenkronBaslat();
})();
</script>
